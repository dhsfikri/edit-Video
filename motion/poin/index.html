<!doctype html>
<!--
  B-roll POIN — Gaya v2+ (1080x1920, ambil alih skrin penuh dengan sapuan hijau masuk & keluar).
  A-roll (klip dari base.mov) → sapuan → latar hijau gelap + muka Sir dalam bulatan + grafik ikut suara → sapuan → A-roll.
  Variables:
    scene : "offer" (senarai semak ✓)  |  "nama" (carian nama + kad tempat)
    face  : klip muka (pipeline/facecrop.py, dipad ke 12s)     aroll : klip A-roll 1080x1920 (dipad ke 12s)
    cue   : JSON {"on":t,"off":t,"items":[t,...]}  — masa dalam klip ini (ikut perkataan Sir)
  Render: npx hyperframes render --variables '{...}' -f 30 -q high -w 4 -o out.mp4  → trim ffmpeg -t <dur>
  Zon: semua teks x 60–900, y 250–1250 (subtitle video utama y 1300–1400 kekal kosong).
-->
<html lang="ms" data-resolution="portrait"
  data-composition-variables='[
    {"id":"scene","type":"string","label":"Babak","default":"offer"},
    {"id":"face","type":"string","label":"Klip muka","default":"assets/face_offer.mp4"},
    {"id":"aroll","type":"string","label":"Klip A-roll","default":"assets/aroll_offer.mp4"},
    {"id":"cue","type":"string","label":"Cue JSON","default":""}
  ]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Montserrat"; font-weight: 800; src: url("assets/montserrat-latin-800-normal.woff2") format("woff2"); }
      @font-face { font-family: "Montserrat"; font-weight: 600; src: url("assets/montserrat-latin-600-normal.woff2") format("woff2"); }
      @font-face { font-family: "Caveat"; font-weight: 700; src: url("assets/caveat-latin-700-normal.woff2") format("woff2"); }
      @font-face { font-family: "Noto Color Emoji"; src: local("Noto Color Emoji"); }
      :root { --bg1: #0b3d2e; --bg2: #06180f; --green: #25d366; --deep: #0b3d2e; --white: #fff; --yellow: #ffd60a; --ink: #0b0b0b; --red: #ff5a5a; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Montserrat", "Noto Color Emoji", sans-serif; }
      #aroll { position: absolute; inset: 0; width: 1080px; height: 1920px; object-fit: cover; }
      #stage { position: absolute; inset: 0; background: radial-gradient(90% 60% at 50% 42%, var(--bg1) 0%, var(--bg2) 100%); }
      #grain { position: absolute; inset: 0; opacity: .07; background-image: radial-gradient(rgba(255,255,255,.6) 1px, transparent 1px); background-size: 6px 6px; }
      #wipe, #wipe2 { position: absolute; top: -100px; left: 0; width: 1700px; height: 2120px; transform: translateX(-1900px) skewX(-8deg); }
      #wipe { background: var(--green); } #wipe2 { background: #0b0b0b; }
      #faceWrap { position: absolute; left: 60px; top: 250px; width: 330px; height: 330px; border-radius: 50%; overflow: hidden;
        border: 7px solid var(--white); box-shadow: 0 16px 40px rgba(0,0,0,.45); }
      #face { width: 100%; height: 100%; object-fit: cover; }
      #title { position: absolute; left: 420px; top: 335px; }
      #title .script { display: block; font-family: "Caveat", cursive; font-weight: 700; font-size: 58px; color: rgba(255,255,255,.92); line-height: 1; }
      #title .box { display: inline-block; margin-top: 10px; background: var(--white); color: var(--deep); font-weight: 800; font-size: 76px;
        padding: 2px 22px; border-radius: 10px; white-space: nowrap; overflow: hidden; vertical-align: top; }

      /* OFFER: senarai semak */
      #hint { position: absolute; left: 66px; top: 640px; display: flex; align-items: center; gap: 22px; }
      #hint .tag { position: relative; background: var(--ink); border: 3px solid rgba(255,255,255,.25); color: var(--yellow); font-weight: 800; font-size: 46px; padding: 8px 24px; border-radius: 14px; }
      #hint .tag i { position: absolute; left: -8px; right: -8px; top: 50%; height: 7px; margin-top: -3px; background: var(--red); border-radius: 4px; transform-origin: left center; }
      #hint .txt { font-family: "Caveat", cursive; font-weight: 700; font-size: 62px; color: #fff; transform: rotate(-3deg); }
      .row { position: absolute; left: 60px; width: 840px; height: 104px; border-radius: 22px; background: var(--ink); border: 4px solid rgba(255,255,255,.14);
        box-shadow: 0 18px 44px rgba(0,0,0,.45); display: flex; align-items: center; gap: 26px; padding: 0 28px; color: #fff; font-weight: 800; font-size: 54px; }
      .row .ck { width: 62px; height: 62px; border-radius: 50%; background: var(--green); color: var(--ink); display: flex; align-items: center; justify-content: center; font-size: 40px; flex: none; }
      .row small { font-family: "Caveat", cursive; font-weight: 700; font-size: 44px; color: rgba(255,255,255,.8); margin-left: auto; }
      .row .glow { position: absolute; inset: -4px; border-radius: 22px; border: 5px solid var(--green); box-shadow: 0 0 40px rgba(37,211,102,.5); opacity: 0; }

      /* NAMA: carian + kad tempat */
      #search { position: absolute; left: 60px; top: 660px; width: 840px; height: 110px; border-radius: 55px; background: #fff; box-shadow: 0 18px 44px rgba(0,0,0,.45);
        display: flex; align-items: center; gap: 20px; padding: 0 36px; font-weight: 800; font-size: 50px; color: var(--deep); }
      #search .q { white-space: nowrap; overflow: hidden; } #search .cur { width: 5px; height: 56px; background: var(--green); }
      .place { position: absolute; top: 830px; width: 405px; height: 400px; border-radius: 26px; background: var(--ink); border: 4px solid rgba(255,255,255,.14);
        box-shadow: 0 24px 60px rgba(0,0,0,.5); display: flex; flex-direction: column; align-items: center; text-align: center; padding: 30px 20px; color: #fff; }
      .place .ico { font-size: 96px; line-height: 1; }
      .place b { font-weight: 800; font-size: 46px; margin-top: 18px; line-height: 1.05; }
      .place .ask { margin-top: auto; font-family: "Caveat", cursive; font-weight: 700; font-size: 54px; color: var(--yellow); transform: rotate(-3deg); }
      .place .glow { position: absolute; inset: -4px; border-radius: 26px; border: 5px solid var(--green); box-shadow: 0 0 46px rgba(37,211,102,.55); opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1080" data-height="1920">
      <video id="aroll" src="assets/aroll_offer.mp4" class="clip" data-start="0" data-duration="12" data-track-index="0" muted playsinline></video>
      <div id="stage" class="clip" data-start="0" data-duration="12" data-track-index="1">
        <div id="grain"></div>
        <div id="title"><span class="script"></span><span class="box"></span></div>
        <div id="body"></div>
      </div>
      <div id="faceWrap"><video id="face" src="assets/face_offer.mp4" class="clip" data-start="0" data-duration="12" data-track-index="2" muted playsinline></video></div>
      <div id="wipe2" class="clip" data-start="0" data-duration="12" data-track-index="3"></div>
      <div id="wipe" class="clip" data-start="0" data-duration="12" data-track-index="4"></div>
    </div>
    <script>
      const V = window.__hyperframes.getVariables();
      const $ = (s) => document.querySelector(s);
      const DEF = { offer: { on: 0.4, off: 8.6, items: [0.6, 2.0, 5.2, 6.5] }, nama: { on: 0.4, off: 4.6, items: [0.6, 1.9, 3.3] } };
      const scene = V.scene === "nama" ? "nama" : "offer";
      const C = V.cue ? JSON.parse(V.cue) : DEF[scene];
      $("#face").setAttribute("src", V.face); $("#aroll").setAttribute("src", V.aroll);
      const D = 12, body = $("#body");
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#grain", { x: 0 }, { x: 6, duration: D, ease: "steps(" + D * 12 + ")" }, 0);

      // Sapuan masuk & keluar
      tl.set(["#stage", "#faceWrap"], { opacity: 0 }, 0);
      [[C.on, 1], [C.off, 0]].forEach(([t, on]) => {
        tl.fromTo("#wipe2", { x: -1900 }, { x: 1300, duration: 0.42, ease: "none", immediateRender: false }, t - 0.25);
        tl.fromTo("#wipe", { x: -1900 }, { x: 1300, duration: 0.42, ease: "none", immediateRender: false }, t - 0.2);
        tl.set(["#stage", "#faceWrap"], { opacity: on }, t);
      });
      tl.fromTo("#faceWrap", { scale: 0, rotation: -20 }, { scale: 1, rotation: 0, duration: 0.4, ease: "back.out(1.8)" }, C.on + 0.08);

      const T = { offer: ["offer yang ada", "VALUE"], nama: ["orang kenal tak", "NAMA BAIK"] }[scene];
      if (scene === "nama") $("#title .box").style.fontSize = "64px"; // kekal dalam x ≤ 900
      $("#title .script").textContent = T[0]; $("#title .box").textContent = T[1];
      tl.fromTo("#title .script", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.25 }, C.on + 0.2);
      const box = $("#title .box"); const bw = box.getBoundingClientRect().width;
      tl.fromTo(box, { width: 0, paddingLeft: 0, paddingRight: 0 }, { width: bw, paddingLeft: 22, paddingRight: 22, duration: 0.35, ease: "steps(8)" }, C.on + 0.32);

      if (scene === "offer") {
        body.innerHTML = `<div id="hint"><span class="tag">RM<i></i></span><span class="txt">bukan sekadar harga…</span></div>`;
        tl.fromTo("#hint", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.25 }, C.on + 0.15);
        tl.fromTo("#hint .tag i", { scaleX: 0 }, { scaleX: 1, duration: 0.2, ease: "power2.in" }, C.on + 0.4);
        const ROWS = [["memudahkan", "senang"], ["berkualiti", "bagus"], ["menjadi", "ada hasil"], ["proven", "ada bukti"]];
        const els = ROWS.map(([t, s], i) => {
          const r = document.createElement("div"); r.className = "row"; r.style.top = 770 + i * 122 + "px";
          r.innerHTML = `<div class="glow"></div><span class="ck">✓</span><span>${t}</span><small>${s}</small>`; body.appendChild(r); return r;
        });
        els.forEach((r, i) => {
          const t = C.items[i];
          tl.fromTo(r, { x: -120, opacity: 0 }, { x: 0, opacity: 1, duration: 0.26, ease: "back.out(1.6)" }, t);
          tl.fromTo(r.querySelector(".ck"), { scale: 0, rotation: -90 }, { scale: 1, rotation: 0, duration: 0.25, ease: "back.out(2.6)" }, t + 0.12);
          tl.fromTo(r.querySelector("small"), { opacity: 0 }, { opacity: 1, duration: 0.2 }, t + 0.3);
          tl.to(r.querySelector(".glow"), { opacity: 1, duration: 0.2 }, t + 0.05);
          if (i) tl.to(els[i - 1].querySelector(".glow"), { opacity: 0, duration: 0.2 }, t);
        });
        tl.to(els.map((r) => r.querySelector(".glow")), { opacity: 1, duration: 0.25 }, C.items[3] + 0.6);
      } else {
        body.innerHTML = `<div id="search"><span>🔍</span><span class="q">kedai awak</span><span class="cur"></span></div>
          <div class="place" style="left:60px"><div class="glow"></div><div class="ico">📱</div><b>media<br>sosial</b><span class="ask">orang perasan?</span></div>
          <div class="place" style="left:495px"><div class="glow"></div><div class="ico">🏘️</div><b>kawasan<br>sendiri</b><span class="ask">orang perasan?</span></div>`;
        tl.fromTo("#search", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.28, ease: "power3.out" }, C.items[0] - 0.25);
        const q = $("#search .q"), qw = q.getBoundingClientRect().width;
        tl.fromTo(q, { width: 0 }, { width: qw, duration: 0.6, ease: "steps(10)" }, C.items[0]);
        tl.fromTo("#search .cur", { opacity: 1 }, { opacity: 0, duration: 0.25, repeat: 13, yoyo: true, ease: "steps(1)" }, C.items[0] + 0.6);
        const ps = [...document.querySelectorAll(".place")];
        ps.forEach((p, i) => {
          const t = C.items[i + 1];
          tl.fromTo(p, { y: 380, opacity: 0 }, { y: 0, opacity: 1, duration: 0.32, ease: "back.out(1.6)" }, t);
          tl.fromTo(p.querySelector(".ico"), { scale: 0, rotation: -30 }, { scale: 1, rotation: 0, duration: 0.3, ease: "back.out(2.5)" }, t + 0.15);
          tl.fromTo(p.querySelector(".ask"), { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2.2)" }, t + 0.45);
          tl.to(p.querySelector(".glow"), { opacity: 1, duration: 0.2 }, t + 0.05);
          if (i) tl.to(ps[i - 1].querySelector(".glow"), { opacity: 0, duration: 0.2 }, t);
        });
      }

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
