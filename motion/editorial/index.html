<!doctype html>
<!--
  EDITORIAL — overlay telus 1080x1920 dengan 4 pakej gaya (lihat EDITORIAL.md).
  Data sama dengan overlay-v2 (window.EDIT dalam data.js) + medan tambahan:
    style       : "clean" | "bold" | "chat" | "magazine"   (boleh override: --variables '{"style":"bold"}')
    transitions : [{t, kind?}]  — peralihan pada titik potong (kind ikut gaya jika kosong)
    chapter     : teks label kecil gaya magazine, cth "RAYA" (optional)
    titleY      : kedudukan y tajuk (default 300; bold 420). Guna bila muka tinggi dalam frame. Per tajuk: g.y
    titleStyle  : gaya tajuk magazine: "glass" (default, kad kaca + kinetic) | "cover" (Anton penuh lebar)
    magMax      : saiz font maksimum baris Anton gaya magazine (default 200)
    hold_end    : tahan frame akhir N saat (untuk CTA)
  Elemen: badge, titles, brackets, callouts, words (subtitle), cta, transitions.
  Semua teks kekal dalam safe zone x 60–900, y 220–1440 (BRANDKIT §5).
-->
<html lang="ms" data-resolution="portrait"
  data-composition-variables='[{"id":"style","type":"string","label":"Gaya (clean|bold|chat|magazine)","default":""}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <script src="data.js"></script>
    <style>
      @font-face { font-family: "Montserrat"; font-weight: 800; src: url("assets/montserrat-latin-800-normal.woff2") format("woff2"); }
      @font-face { font-family: "Montserrat"; font-weight: 600; src: url("assets/montserrat-latin-600-normal.woff2") format("woff2"); }
      @font-face { font-family: "Caveat"; font-weight: 700; src: url("assets/caveat-latin-700-normal.woff2") format("woff2"); }
      @font-face { font-family: "Anton"; font-weight: 400; src: url("assets/anton-latin-400-normal.woff2") format("woff2"); }
      @font-face { font-family: "Noto Color Emoji"; src: local("Noto Color Emoji"); }
      :root { --green: #25d366; --deep: #0b3d2e; --night: #082015; --white: #fff; --ink: #0b0b0b; --yellow: #ffd60a; --red: #ff5a5a; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; font-family: "Montserrat", "Noto Color Emoji", sans-serif; }
      #layer, #fx { position: absolute; inset: 0; }
      .shadow { filter: drop-shadow(0 4px 14px rgba(0,0,0,.45)); }
      .abs { position: absolute; }

      /* ---------- BADGE ---------- */
      #badge { position: absolute; left: 60px; top: 240px; display: flex; align-items: center; gap: 10px; white-space: nowrap; }
      #badge i { width: 14px; height: 14px; border-radius: 50%; background: var(--green); }
      #badge b { color: #fff; font-weight: 800; font-size: 24px; letter-spacing: .06em; } #badge b span { color: var(--green); }
      .s-clean #badge { padding: 8px 18px 8px 14px; border-radius: 999px; background: rgba(11,11,11,.55); border: 2px solid rgba(37,211,102,.8); }
      .s-bold #badge { padding: 10px 22px 10px 16px; border-radius: 999px; background: var(--ink); border: 3px solid var(--green); }
      .s-bold #badge b { font-size: 28px; }
      .s-chat #badge { padding: 8px 20px 8px 10px; border-radius: 999px; background: rgba(8,32,21,.85); }
      .s-chat #badge i { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; font-style: normal; font-size: 20px; color: var(--night); font-weight: 800; }
      .s-chat #badge em { display: block; font-style: normal; font-weight: 600; font-size: 18px; color: var(--green); letter-spacing: .02em; }
      .s-magazine #badge { gap: 14px; }
      .s-magazine #badge i { width: 46px; height: 4px; border-radius: 0; }
      .s-magazine #badge b { font-weight: 600; font-size: 22px; letter-spacing: .32em; }

      /* ---------- TITLES ---------- */
      .title { position: absolute; left: 60px; top: 300px; width: 840px; }
      .tl { display: block; white-space: nowrap; line-height: 1.05; margin-bottom: 6px; }
      .tk { display: inline-block; margin-right: 14px; vertical-align: bottom; white-space: nowrap; }
      .tk:last-child { margin-right: 0; }
      /* clean (Gaya v2) */
      .s-clean .tk.script { font-family: "Caveat", cursive; font-weight: 700; font-size: 54px; color: #fff; }
      .s-clean .tk.bold { font-weight: 800; font-size: 66px; color: #fff; }
      .s-clean .tk.box { font-weight: 800; font-size: 80px; color: var(--deep); background: #fff; padding: 0 18px; border-radius: 10px; overflow: hidden; }
      /* bold & laju */
      .s-bold .title { top: 420px; text-align: center; }
      .s-bold .tl { margin-bottom: 10px; }
      .s-bold .tk { font-weight: 800; text-transform: uppercase; color: #fff; -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill;
        text-shadow: 0 8px 0 rgba(0,0,0,.55); }
      .s-bold .tk.script { font-size: 48px; color: var(--yellow); }
      .s-bold .tk.bold { font-size: 92px; }
      .s-bold .tk.box { font-size: 100px; color: var(--ink); -webkit-text-stroke: 0; text-shadow: none; background: var(--yellow); padding: 0 22px; border-radius: 6px; transform: rotate(-2deg); box-shadow: 0 8px 0 rgba(0,0,0,.55); }
      /* chat story */
      .s-chat .title { top: 300px; }
      .s-chat .tl { margin-bottom: 14px; }
      /* chat: headline besar di luar bubble (k:"head", [kata] = keyword hijau) */
      .s-chat .hd { display: block; font-weight: 800; font-size: 74px; line-height: 1.04; color: #fff; text-transform: uppercase; margin: 6px 0 10px;
        text-shadow: 0 6px 24px rgba(0,0,0,.6); white-space: normal; }
      .s-chat .hd .w { display: inline-block; margin-right: .22em; white-space: nowrap; }
      .s-chat .hd .w.key { color: var(--ink); background: var(--green); padding: 0 14px; border-radius: 12px; text-shadow: none; }
      .bub { display: inline-block; position: relative; padding: 16px 26px; border-radius: 34px 34px 34px 8px; background: #fff; color: var(--night);
        font-weight: 800; font-size: 54px; box-shadow: 0 6px 18px rgba(0,0,0,.35); transform-origin: 0% 100%; white-space: nowrap; }
      .bub.small { font-weight: 600; font-size: 38px; padding: 12px 22px; }
      .bub.out { background: var(--green); color: var(--ink); border-radius: 34px 34px 8px 34px; transform-origin: 100% 100%; }
      .tl.right { text-align: right; }
      .bub .tick { font-size: 26px; margin-left: 10px; color: var(--deep); font-weight: 800; }
      .typing { display: inline-flex; gap: 10px; padding: 22px 28px; border-radius: 34px 34px 34px 8px; background: #fff; box-shadow: 0 6px 18px rgba(0,0,0,.35); }
      .typing i { width: 14px; height: 14px; border-radius: 50%; background: #9aa5a0; display: block; }
      /* editorial magazine */
      .s-magazine .title { top: 300px; }
      .s-magazine .tl { line-height: .98; margin-bottom: 0; }
      .s-magazine .mask { display: block; overflow: hidden; padding-bottom: 2px; }
      .s-magazine .inner { display: inline-block; white-space: nowrap; }
      .s-magazine .tk { font-family: "Anton", sans-serif; font-weight: 400; text-transform: uppercase; color: #fff; font-size: 1em; margin-right: .22em; }
      .s-magazine .tk.box { color: var(--yellow); }  /* Sir pilih: keyword kuning (2026-11-05) */
      .s-magazine .kick { font-family: "Caveat", cursive; font-weight: 700; font-size: 58px; color: var(--yellow); display: block; margin-bottom: 2px; }
      .s-magazine .rule { height: 4px; background: #fff; transform-origin: 0 50%; margin-bottom: 18px; width: 840px; }
      .s-magazine .chap { font-weight: 600; font-size: 22px; letter-spacing: .32em; color: #fff; margin-bottom: 10px; display: flex; justify-content: space-between; width: 840px; }
      .s-magazine .chap span { color: var(--green); }
      /* magazine — tajuk KAD KACA (pilihan Sir 2026-11-05). Blur sebenar dibuat oleh compose.py (window.__glass) */
      .glass { position: relative; width: 840px; padding: 32px 40px 34px; border-radius: 30px; background: linear-gradient(135deg, rgba(255,255,255,.14), rgba(20,20,20,.34) 45%, rgba(10,10,10,.42));
        border: 2px solid rgba(255,255,255,.28); box-shadow: 0 20px 50px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.35); }
      .glass .gl { font-weight: 600; font-size: 26px; letter-spacing: .28em; color: var(--yellow); white-space: nowrap; }
      .glass .gk { font-family: "Caveat", cursive; font-weight: 700; font-size: 50px; color: rgba(255,255,255,.9); margin-top: 6px; }
      .glass .gt { font-weight: 800; font-size: 82px; line-height: 1.04; color: #fff; margin-top: 8px; }
      .glass .gw { display: inline-block; white-space: nowrap; margin-right: .24em; }
      .glass .gw.key { color: var(--yellow); }
      .glass .gw .ch { display: inline-block; }
      .glass .gb { height: 8px; width: 180px; background: var(--yellow); border-radius: 4px; margin-top: 22px; transform-origin: 0 50%; }

      /* ---------- BRACKET ---------- */
      .br { position: absolute; width: 58px; height: 58px; border-color: #fff; border-style: solid; border-width: 0; --bw: 7px; }
      .s-bold .br { border-color: var(--yellow); --bw: 10px; }
      .s-chat .br { border-color: var(--green); }
      .s-magazine .br { --bw: 3px; width: 70px; height: 70px; }
      .br.tl0 { border-top-width: var(--bw); border-left-width: var(--bw); } .br.tr0 { border-top-width: var(--bw); border-right-width: var(--bw); }
      .br.bl0 { border-bottom-width: var(--bw); border-left-width: var(--bw); } .br.br0 { border-bottom-width: var(--bw); border-right-width: var(--bw); }

      /* ---------- CALLOUT ---------- */
      .co { position: absolute; display: flex; align-items: center; gap: 10px; background: #fff; color: var(--ink); font-weight: 800; font-size: 34px;
        padding: 10px 22px 10px 14px; border-radius: 16px; white-space: nowrap; }
      .co .ic { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 26px; color: #fff; }
      .co.ok .ic { background: var(--green); } .co.no { background: rgba(20,20,20,.78); color: #fff; } .co.no .ic { background: var(--red); }
      .co.tag .ic { display: none; } .co.tag { padding: 8px 18px; font-size: 30px; }
      .s-bold .co { border-radius: 6px; font-size: 38px; text-transform: uppercase; border: 4px solid var(--ink); }
      .s-bold .co.ok { background: var(--yellow); }
      .s-chat .co { background: rgba(8,32,21,.78); border: 5px solid var(--green); color: var(--green); border-radius: 12px; text-transform: uppercase; letter-spacing: .04em; transform: rotate(-6deg); }
      .s-chat .co.no { border-color: var(--red); color: var(--red); background: rgba(20,8,8,.78); }
      .s-chat .co .ic { background: transparent !important; color: inherit; font-size: 34px; }
      .s-chat .co, .s-chat .co span { text-shadow: 0 2px 8px rgba(0,0,0,.5); }
      .s-magazine .co { background: rgba(20,20,20,.55); color: #fff; border-radius: 18px; border: 2px solid rgba(255,255,255,.28); border-left: 8px solid var(--yellow); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; font-size: 30px; padding: 6px 18px; }
      .s-magazine .co.no { border-left-color: var(--red); }
      .s-magazine .co .ic { display: none; }

      /* ---------- SUBTITLE ---------- */
      #subs { position: absolute; left: 60px; width: 840px; top: 1320px; height: 100px; }
      .grp { position: absolute; left: 0; right: 0; top: 0; text-align: center; white-space: nowrap; }
      .sw { display: inline-block; margin: 0 2px; padding: 2px 10px; border-radius: 10px; font-weight: 800; font-size: 46px; color: #fff; text-shadow: 0 3px 10px rgba(0,0,0,.6); }
      .s-clean .sw.on { background: var(--green); color: var(--ink); text-shadow: none; }
      .s-bold .sw { font-size: 58px; text-transform: uppercase; -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 0 5px 0 rgba(0,0,0,.6); padding: 0 4px; margin: 0 8px; }
      .s-bold .sw.on { color: var(--yellow); }
      .s-chat .grp span.wrap { display: inline-block; background: rgba(8,32,21,.82); border-radius: 22px; padding: 8px 14px; }
      .s-chat .sw { font-size: 42px; text-shadow: none; padding: 0 6px; }
      .s-chat .sw.on { color: var(--green); }
      .s-magazine .sw { font-weight: 600; font-size: 42px; padding: 0 4px 2px; border-radius: 0; border-bottom: 5px solid transparent; }
      .s-magazine .sw.on { border-bottom-color: var(--yellow); }

      /* ---------- CTA ---------- */
      #cta { position: absolute; left: 60px; width: 840px; top: 1190px; text-align: center; }
      #cta span { display: inline-block; font-weight: 800; font-size: 36px; padding: 14px 30px; border-radius: 999px; background: #fff; color: var(--deep); }
      .s-bold #cta span { background: var(--green); color: var(--ink); border: 4px solid var(--ink); border-radius: 8px; font-size: 42px; text-transform: uppercase; }
      .s-chat #cta span { background: var(--green); color: var(--ink); border-radius: 34px 34px 8px 34px; }
      .s-magazine #cta span { background: rgba(20,20,20,.6); color: #fff; border: 2px solid rgba(255,255,255,.35); border-radius: 22px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; font-size: 30px; }

      /* ---------- FX (peralihan & suasana) ---------- */
      .fx-flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
      .fx-soft { position: absolute; inset: 0; background: #fff; opacity: 0; }
      .fx-panel { position: absolute; left: 0; width: 1080px; height: 1920px; top: 0; }
      .fx-bar { position: absolute; top: 0; height: 1920px; width: 1080px; left: 0; }
      .vignette { position: absolute; inset: 0; background: radial-gradient(ellipse 75% 60% at 50% 45%, rgba(0,0,0,0) 55%, rgba(0,0,0,.42) 100%); }
      .bars { position: absolute; left: 0; right: 0; height: 60px; background: #000; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="40" data-width="1080" data-height="1920">
      <div id="layer" class="clip" data-start="0" data-duration="40" data-track-index="0"></div>
    </div>
    <script>
      const E = window.EDIT, D = E.duration;
      // panjang composition ikut video (render tak lebih dari perlu)
      ["root", "layer"].forEach((id) => document.getElementById(id).setAttribute("data-duration", String(Math.ceil(D * 10) / 10)));
      const V = (window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {}) || {};
      const STYLE = (V.style || E.style || "clean");
      document.body.classList.add("s-" + STYLE);
      const layer = document.getElementById("layer");
      const tl = gsap.timeline({ paused: true });
      const el = (h) => { const t = document.createElement("template"); t.innerHTML = h.trim(); return t.content.firstChild; };
      const put = (h, parent = layer) => parent.appendChild(el(h));
      const hideAt0 = (n) => tl.set(n, { opacity: 0 }, 0);

      // ---------- Suasana (lapisan bawah) ----------
      if (STYLE === "magazine") put(`<div class="vignette"></div>`);

      // ---------- Badge siri ----------
      let badgeHtml;
      if (STYLE === "chat") badgeHtml = `<div id="badge"><i>✓</i><div><b>${E.series} <span>#${E.episode}</span></b><em>● online · @sirdharma_</em></div></div>`;
      else if (STYLE === "magazine") badgeHtml = `<div id="badge"><i></i><b>${E.series} <span>NO. ${E.episode}</span></b></div>`;
      else badgeHtml = `<div id="badge"><i></i><b>${E.series} <span>#${E.episode}</span></b></div>`;
      const badge = put(badgeHtml);
      if (STYLE === "bold") tl.fromTo(badge, { opacity: 0, scale: 1.6 }, { opacity: 1, scale: 1, duration: 0.2, ease: "back.out(3)", transformOrigin: "0% 50%" }, 0);
      else if (STYLE === "magazine") tl.fromTo(badge, { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.45, ease: "power4.out" }, 0);
      else tl.fromTo(badge, { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.3 }, 0);
      (E.hideBadge || []).forEach(([a, b]) => { tl.set(badge, { opacity: 0 }, a); if (b < D) tl.set(badge, { opacity: 1 }, b); });

      // Kecilkan baris yang terlebih lebar (safe zone 840px)
      const fit = (node, maxW = 840) => { const w = node.scrollWidth; if (w > maxW) node.style.zoom = (maxW / w).toFixed(3); };

      // ---------- Tajuk ----------
      const titleBuilders = {
        clean(g, box) {
          g.lines.forEach((line) => {
            const ln = put(`<span class="tl"></span>`, box);
            const toks = line.map((tok) => ({ tok, s: put(`<span class="tk ${tok.k}">${tok.text}</span>`, ln) }));
            fit(ln);
            toks.forEach(({ tok, s }) => {
              if (tok.k === "box") {
                const w = s.offsetWidth, n = tok.text.length;
                hideAt0(s);
                tl.fromTo(s, { opacity: 1, width: 0, paddingLeft: 0, paddingRight: 0 },
                  { width: w, paddingLeft: 18, paddingRight: 18, duration: Math.min(0.06 * n, 0.4), ease: `steps(${n})` }, tok.t);
              } else tl.fromTo(s, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.18, ease: "power2.out" }, tok.t);
            });
          });
          if (g.end < D) tl.to(box, { opacity: 0, y: -20, duration: 0.15 }, g.end - 0.15);
        },
        bold(g, box) {
          g.lines.forEach((line) => {
            const ln = put(`<span class="tl"></span>`, box);
            const toks = line.map((tok) => ({ tok, s: put(`<span class="tk ${tok.k}">${tok.text}</span>`, ln) }));
            fit(ln);
            toks.forEach(({ tok, s }) => {
              const rot = tok.k === "box" ? -2 : 0;
              tl.fromTo(s, { opacity: 0, scale: 2.4, rotation: rot + (Math.random() * 8 - 4) },
                { opacity: 1, scale: 1, rotation: rot, duration: 0.16, ease: "back.out(2.5)" }, tok.t);
              tl.fromTo(box, { x: 0 }, { x: 6, duration: 0.03, yoyo: true, repeat: 3, ease: "none" }, tok.t + 0.14);
            });
          });
          if (g.end < D) tl.to(box, { opacity: 0, scale: 0.85, duration: 0.1 }, g.end - 0.1);
        },
        chat(g, box) {
          g.lines.forEach((line) => {
            if (line.every((t) => t.k === "head")) {
              // [kata kunci] dalam kurungan → kotak hijau
              const txt = line.map((t) => t.text).join(" ");
              const hd = put(`<div class="hd"></div>`, box);
              const parts = txt.match(/\[[^\]]+\]|\S+/g) || [];
              const ws = parts.map((p) => {
                const key = p.startsWith("[");
                return put(`<span class="w ${key ? "key" : ""}">${key ? p.slice(1, -1) : p}</span>`, hd);
              });
              // muat dalam safe zone: kecilkan kalau ada perkataan/keyword lebih 840px
              const widest = Math.max(...ws.map((x) => x.offsetWidth));
              if (widest > 840) hd.style.fontSize = Math.floor(74 * 820 / widest) + "px";
              tl.fromTo(ws, { opacity: 0, y: 30, scale: 1.3 }, { opacity: 1, y: 0, scale: 1, duration: 0.2, ease: "back.out(2.6)", stagger: 0.07 }, line[0].t);
              return;
            }
            const isOut = line.some((t) => t.k === "box");
            const isSmall = line.every((t) => t.k === "script");
            const text = line.map((t) => t.text).join(" ");
            const ln = put(`<span class="tl ${isOut ? "right" : ""}"></span>`, box);
            const t0 = line[0].t;
            const b = put(`<span class="bub ${isOut ? "out" : ""} ${isSmall ? "small" : ""}">${text}${isOut ? '<span class="tick">✓✓</span>' : ""}</span>`, ln);
            fit(ln);
            // "typing…" sebelum bubble masuk (bubble keluar kiri sahaja)
            const tyAt = Math.max(g.start, t0 - 0.32);
            if (!isOut && t0 - tyAt > 0.12) {
              const ty = put(`<div class="typing abs"><i></i><i></i><i></i></div>`, ln);
              ty.style.left = "0px"; ty.style.top = "0px";
              ln.style.position = "relative";
              hideAt0(ty);
              tl.set(ty, { opacity: 1 }, tyAt);
              tl.fromTo(ty.children, { y: 0 }, { y: -8, duration: 0.1, stagger: 0.06, yoyo: true, repeat: 1 }, tyAt);
              tl.set(ty, { opacity: 0 }, t0);
            }
            tl.fromTo(b, { opacity: 0, scale: 0.6, y: 20 }, { opacity: 1, scale: 1, y: 0, duration: 0.22, ease: "back.out(2.4)" }, t0);
          });
          if (g.end < D) tl.to(box, { opacity: 0, y: -30, duration: 0.15 }, g.end - 0.15);
        },
        magazine(g, box) {
          if ((E.titleStyle || "glass") === "glass") return titleBuilders.glass(g, box);
          return titleBuilders.cover(g, box);
        },
        // KAD KACA + kinetic typography: label → (kicker) → perkataan masuk satu-satu (blur→tajam), keyword huruf demi huruf kuning
        glass(g, box) {
          const t0 = g.lines[0][0].t;
          const label = g.label || `${(g.chapter || E.chapter || E.series).toUpperCase()} · ${String(g.no || 1).padStart(2, "0")}`;
          const card = put(`<div class="glass"><div class="gl">${label}</div></div>`, box);
          const kick = g.lines.filter((l) => l.every((t) => t.k === "script")).map((l) => l.map((t) => t.text).join(" ")).join(" ");
          let kEl = null;
          if (kick) kEl = put(`<div class="gk">${kick}</div>`, card);
          const gt = put(`<div class="gt"></div>`, card);
          const words = [];
          g.lines.filter((l) => !l.every((t) => t.k === "script")).forEach((line) => line.forEach((tok) => {
            tok.text.split(/\s+/).filter(Boolean).forEach((wd) => {
              const key = tok.k === "box";
              const w = put(`<span class="gw ${key ? "key" : ""}"></span>`, gt);
              if (key) [...wd].forEach((c) => put(`<span class="ch">${c}</span>`, w)); else w.textContent = wd;
              words.push({ w, key });
            });
          }));
          const bar = put(`<div class="gb"></div>`, card);
          // kad
          tl.fromTo(card, { opacity: 0, y: 24, scale: 0.97 }, { opacity: 1, y: 0, scale: 1, duration: 0.25, ease: "power3.out" }, t0);
          tl.fromTo(card.querySelector(".gl"), { opacity: 0, x: -16, letterSpacing: "0.6em" }, { opacity: 1, x: 0, letterSpacing: "0.28em", duration: 0.4, ease: "power3.out" }, t0 + 0.08);
          if (kEl) tl.fromTo(kEl, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.25 }, t0 + 0.14);
          // perkataan
          let at = t0 + (kEl ? 0.24 : 0.16);
          words.forEach(({ w, key }) => {
            if (key) {
              const chs = w.querySelectorAll(".ch");
              tl.fromTo(chs, { opacity: 0, y: 36, scale: 1.4, filter: "blur(6px)" },
                { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.28, ease: "back.out(2.2)", stagger: 0.035 }, at);
              at += 0.035 * chs.length + 0.08;
            } else {
              tl.fromTo(w, { opacity: 0, y: 30, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.3, ease: "power3.out" }, at);
              at += 0.09;
            }
          });
          tl.fromTo(bar, { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power4.inOut" }, at);
          if (g.end < D) tl.to(card, { opacity: 0, y: -16, duration: 0.2, ease: "power2.in" }, g.end - 0.2);
          // geometri kad untuk blur sebenar (compose.py)
          box.__glass = { card, start: t0, end: Math.min(g.end, D) };
        },
        cover(g, box) {
          const chap = put(`<div class="chap"><div>${(g.chapter || E.chapter || E.series).toUpperCase()}</div><span>${String(g.no || 1).padStart(2, "0")} / ${String(E.titles.length).padStart(2, "0")}</span></div>`, box);
          const rule = put(`<div class="rule"></div>`, box);
          const t0 = g.lines[0][0].t;
          tl.fromTo(rule, { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power4.inOut" }, Math.max(t0 - 0.05, g.start));
          tl.fromTo(chap, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3 }, t0);
          const inners = [];
          g.lines.forEach((line) => {
            if (line.every((t) => t.k === "script")) {
              const k = put(`<span class="kick">${line.map((t) => t.text).join(" ")}</span>`, box);
              tl.fromTo(k, { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, line[0].t);
              inners.push(k); return;
            }
            const mask = put(`<span class="tl mask"></span>`, box);
            const inner = put(`<span class="inner"></span>`, mask);
            line.forEach((tok) => put(`<span class="tk ${tok.k}">${tok.text}</span>`, inner));
            // gaya cover: baris dibesarkan sampai penuh 840px
            inner.style.fontSize = "100px";
            const w = inner.scrollWidth;
            inner.style.fontSize = Math.min(E.magMax || 200, Math.max(70, 100 * 840 / w)).toFixed(1) + "px";
            tl.fromTo(inner, { yPercent: 105 }, { yPercent: 0, duration: 0.45, ease: "power4.out" }, line[0].t);
            inners.push(inner);
          });
          if (g.end < D) {
            tl.to(inners, { yPercent: -105, opacity: 0, duration: 0.25, ease: "power3.in", stagger: 0.03 }, g.end - 0.3);
            tl.to([rule, chap], { opacity: 0, duration: 0.2 }, g.end - 0.2);
          }
        },
      };
      (E.titles || []).forEach((g, i) => {
        g.no = i + 1;
        const box = put(`<div class="title ${STYLE === "magazine" ? "" : "shadow"}"></div>`);
        if (g.start > 0) { tl.set(box, { opacity: 0 }, 0); tl.set(box, { opacity: 1 }, g.start); }
        if (E.titleY != null || g.y != null) box.style.top = (g.y ?? E.titleY) + "px";
        (titleBuilders[STYLE] || titleBuilders.clean)(g, box);
        // pengawal safe zone: bawah tajuk mesti atas subtitle (y 1290)
        const top = parseFloat(getComputedStyle(box).top), h = box.offsetHeight;
        if (top + h > 1290) box.style.top = Math.max(300, 1290 - h) + "px";
        if (box.__glass) {
          // dikira bila dipanggil (selepas font siap dimuat) — offset* tak terkesan oleh transform animasi
          const G = box.__glass, c = G.card;
          (window.__glassRefs = window.__glassRefs || []).push(() => ({ x: box.offsetLeft + c.offsetLeft, y: box.offsetTop + c.offsetTop,
            w: c.offsetWidth, h: c.offsetHeight, start: +G.start.toFixed(3), end: +G.end.toFixed(3), radius: 30 }));
        }
      });

      // ---------- Bracket fokus ----------
      (E.brackets || []).forEach((b) => {
        const [x, y, w, h] = b.box, p = 0.35 * w, sz = STYLE === "magazine" ? 70 : 58;
        const L = x - p, T = y - p, R = x + w + p, B = y + h + p * 1.2;
        const corners = [["tl0", L, T], ["tr0", R - sz, T], ["bl0", L, B - sz], ["br0", R - sz, B - sz]].map(([c, cx, cy]) => {
          const n = put(`<div class="br ${c} shadow"></div>`); n.style.left = cx + "px"; n.style.top = cy + "px"; return n;
        });
        hideAt0(corners);
        corners.forEach((n, i) => {
          const dx = i % 2 ? 40 : -40, dy = i < 2 ? -40 : 40;
          tl.fromTo(n, { opacity: 0, x: dx, y: dy }, { opacity: 1, x: 0, y: 0, duration: STYLE === "bold" ? 0.1 : 0.18, ease: "power3.out" }, b.start);
        });
        tl.to(corners, { scale: 0.92, duration: 0.12, yoyo: true, repeat: 1 }, b.start + 0.2);
        tl.set(corners, { opacity: 0 }, b.end);
      });

      // ---------- Callout ----------
      (E.callouts || []).forEach((c) => {
        const icon = c.kind === "ok" ? "✓" : c.kind === "no" ? "✕" : "";
        const n = put(`<div class="co ${c.kind} shadow"><span class="ic">${icon}</span><span>${c.text}</span></div>`);
        n.style.left = c.x + "px"; n.style.top = c.y + "px";
        const wN = n.getBoundingClientRect().width; if (c.x + wN > 900) n.style.left = Math.max(60, 900 - wN) + "px";
        hideAt0(n);
        if (STYLE === "chat") tl.fromTo(n, { opacity: 0, scale: 2.2, rotation: -14 }, { opacity: 1, scale: 1, rotation: -6, duration: 0.18, ease: "power4.in" }, c.t);
        else if (STYLE === "magazine") tl.fromTo(n, { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.35, ease: "power4.out" }, c.t);
        else if (STYLE === "bold") tl.fromTo(n, { opacity: 0, scale: 1.8 }, { opacity: 1, scale: 1, duration: 0.14, ease: "back.out(3)" }, c.t);
        else tl.fromTo(n, { opacity: 0, scale: 0.6, x: -20 }, { opacity: 1, scale: 1, x: 0, duration: 0.22, ease: "back.out(2.2)" }, c.t);
        if (c.end < D) tl.to(n, { opacity: 0, duration: 0.12 }, c.end - 0.12);
      });

      // ---------- Subtitle karaoke ----------
      const subs = put(`<div id="subs"></div>`);
      const maxW = STYLE === "bold" ? Math.min(E.maxWords || 3, 3) : (E.maxWords || 4);
      const groups = []; let cur = [];
      E.words.forEach((w, i) => {
        const prev = E.words[i - 1];
        const brk = cur.length >= maxW || (prev && (w.s - prev.e > 0.3 || /[.,?!]$/.test(prev.w)));
        if (cur.length && brk) { groups.push(cur); cur = []; }
        cur.push(w);
      });
      if (cur.length) groups.push(cur);
      groups.forEach((g, gi) => {
        const node = put(`<div class="grp"></div>`, subs);
        const host = STYLE === "chat" ? put(`<span class="wrap"></span>`, node) : node;
        const spans = g.map((w, i) => { if (i) host.appendChild(document.createTextNode(" ")); return put(`<span class="sw">${w.w}</span>`, host); });
        fit(node);
        hideAt0(node);
        const st = Math.max(g[0].s - 0.05, 0);
        if (STYLE === "bold") tl.fromTo(node, { opacity: 0, scale: 1.25 }, { opacity: 1, scale: 1, duration: 0.08 }, st);
        else tl.fromTo(node, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.12 }, st);
        g.forEach((w, i) => {
          tl.set(spans[i], { className: "sw on" }, w.s);
          if (STYLE === "bold") tl.fromTo(spans[i], { scale: 1.15 }, { scale: 1, duration: 0.12, immediateRender: false }, w.s);
          tl.set(spans[i], { className: "sw" }, g[i + 1] ? g[i + 1].s : w.e + 0.15);
        });
        const nxt = groups[gi + 1];
        tl.set(node, { opacity: 0 }, nxt ? nxt[0].s - 0.05 : Math.min(g[g.length - 1].e + 0.4, D));
      });

      // ---------- CTA ----------
      if (E.cta) {
        const c = put(`<div id="cta"><span class="shadow">${E.cta.text}</span></div>`);
        hideAt0(c);
        tl.fromTo(c, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.25, ease: "back.out(2)" }, E.cta.start);
      }

      // ---------- Peralihan (di atas semua) ----------
      const defKind = { clean: "soft", bold: "flash", chat: "swipe", magazine: "wipe" }[STYLE];
      (E.transitions || []).forEach((tr) => {
        const k = tr.kind || defKind, t = tr.t;
        if (k === "flash") {
          const f = put(`<div class="fx-flash"></div>`);
          tl.fromTo(f, { opacity: 0.85 }, { opacity: 0, duration: 0.12, ease: "power1.in", immediateRender: false }, t);
        } else if (k === "soft") {
          const f = put(`<div class="fx-soft"></div>`);
          tl.to(f, { opacity: 0.22, duration: 0.08 }, t - 0.08);
          tl.to(f, { opacity: 0, duration: 0.16 }, t);
        } else if (k === "swipe") {
          const p = put(`<div class="fx-panel" style="background:var(--night)"></div>`);
          tl.set(p, { yPercent: 100 }, 0);
          tl.fromTo(p, { yPercent: 100 }, { yPercent: 0, duration: 0.14, ease: "power3.in", immediateRender: false }, t - 0.14);
          tl.to(p, { yPercent: -100, duration: 0.16, ease: "power3.out" }, t);
        } else if (k === "wipe") {
          const a = put(`<div class="fx-bar" style="background:var(--green)"></div>`);
          const b = put(`<div class="fx-bar" style="background:#0b0b0b"></div>`);
          tl.fromTo(a, { xPercent: -100 }, { xPercent: 0, duration: 0.14, ease: "power3.in" }, t - 0.17);
          tl.fromTo(b, { xPercent: -100 }, { xPercent: 0, duration: 0.14, ease: "power3.in" }, t - 0.12);
          tl.set(a, { xPercent: 100 }, t);
          tl.to(b, { xPercent: 100, duration: 0.18, ease: "power3.out" }, t);
        }
      });

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
