<!doctype html>
<!--
  GAYA EDITORIAL (asas: docs/rujukan/editorial-akid/) — versi BRANDKIT Sir (2026-11-18):
  warna hijau #25D366 · hitam #0B0B0B · putih · kuning #FFD60A (keyword) · font TEBAL sahaja (Poppins 600–800, tiada serif kurus).
  Sir PENUH SKRIN hampir sepanjang masa (tangkapan lebar, zoom maks ~1.1); grafik kecil di SEPERTIGA ATAS; satu elemen pada satu masa.
  Gerakan licin: masuk power3.out 0.45–0.6s, keluar power2.in 0.25s, peralihan babak = BLUR. Tiada lantunan, tiada emoji.
  Koreografi: scene.js (salin dari projects/<ID>/scene_ed.js): window.ED = { duration, words, keywords, scene(tl, api, put) }
-->
<html lang="ms" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Poppins"; font-weight: 800; src: url("assets/poppins-latin-800-normal.woff2") format("woff2"); }
      @font-face { font-family: "Poppins"; font-weight: 700; src: url("assets/poppins-latin-700-normal.woff2") format("woff2"); }
      @font-face { font-family: "Poppins"; font-weight: 600; src: url("assets/poppins-latin-600-normal.woff2") format("woff2"); }
      @font-face { font-family: "Poppins"; font-weight: 400; src: url("assets/poppins-latin-400-normal.woff2") format("woff2"); }
      @font-face { font-family: "Anton"; src: url("assets/anton-latin-400-normal.woff2") format("woff2"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0B0B0B; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Poppins", sans-serif; background: #0B0B0B; }
      .L { position: absolute; inset: 0; }
      #camWrap { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; }
      #camWrap video { width: 1080px; height: 1920px; display: block; }
      #vig { background: radial-gradient(120% 80% at 50% 45%, transparent 60%, rgba(0,0,0,.35) 100%); }
      .lbl { font-weight: 800; font-size: 32px; letter-spacing: .22em; text-transform: uppercase; }
      .big { font-weight: 800; line-height: .95; letter-spacing: -.02em; }
      .kw { color: #FFD60A; }
      .card { position: absolute; background: #fff; border-radius: 26px; box-shadow: 0 18px 40px rgba(0,0,0,.28); }
      .strike { position: absolute; left: -8px; right: -8px; top: 52%; height: 8px; background: #FF4D4D; border-radius: 4px; transform: scaleX(0); transform-origin: left; }
      #caps { position: absolute; left: 60px; right: 180px; top: 1290px; height: 90px; }
      .cg { position: absolute; left: 0; right: 0; top: 0; text-align: center; opacity: 0; }
      .cg span.box { display: inline-block; background: rgba(11,11,11,.88); border-radius: 12px; padding: 8px 20px; white-space: nowrap; }
      .cw { display: inline-block; margin: 0 6px; font-weight: 700; font-size: 46px; color: rgba(255,255,255,.38); }
      .cw.on { color: #fff; } .cw.k.on { color: #FFD60A; }
      /* MOD CAPTION "PRO" (rujukan pro-miracle): tiada kotak; perkataan kecil putih berbayang; kata kunci = DISPLAY Anton besar kuning, baris sendiri */
      #caps.pro { top: 1180px; height: 260px; }
      #caps.pro .cg span.box { background: none; padding: 0; }
      #caps.pro .cw { font-size: 50px; color: rgba(255,255,255,.0); text-shadow: 0 4px 16px rgba(0,0,0,.7); }
      #caps.pro .cw.on { color: #fff; }
      #caps.pro .cw.k { display: block; font-family: "Anton"; font-weight: 400; font-size: 150px; line-height: 1; letter-spacing: .01em; text-transform: uppercase; margin: 4px 0 0; color: rgba(255,214,10,0); }
      #caps.pro .cw.k.on { color: #FFD60A; }
      #caps.pro .cw.k.r.on { color: #FF4D4D; }
    </style>
    <script src="scene.js"></script>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="62.28" data-width="1080" data-height="1920">
      <div id="back" class="L"></div>
      <div id="cam" class="L"><div id="camWrap"><video id="base" src="assets/base.mp4" class="clip" data-start="0" data-duration="62.28" data-track-index="0" muted playsinline></video></div></div>
      <div id="vig" class="L"></div>
      <div id="top" class="L"></div>
      <div id="fx" class="L"></div>
      <div id="caps"></div>
    </div>
    <script>
      const P = window.ED, D = P.duration;
      const tl = gsap.timeline({ paused: true });
      const $ = (s, r = document) => r.querySelector(s);
      const el = (h) => { const t = document.createElement("template"); t.innerHTML = h.trim(); return t.content.firstChild; };
      const put = (h, layer = "#top") => (typeof layer === "string" ? $(layer) : layer).appendChild(el(h));
      const F = P.face || { x: 526, y: 760 };
      // FRAMING: video diturunkan SY px supaya kepala di bawah zon grafik (elak cutout). Atas = hitam brand pudar ke video.
      const SY = P.shiftY || 0;
      // keadaan kamera awal (frame 0). Babak boleh beri P.initCam (contoh hook crash-zoom) — renderer undur ke 0 dan pulihkan nilai INI.
      const INIT = P.initCam || { x: 0, y: SY, scale: 1, filter: "blur(0px)" };
      gsap.set("#camWrap", INIT);
      tl.set("#camWrap", INIT, 0);
      if (SY) $("#cam").insertAdjacentHTML("afterend", `<div class="L" style="background:linear-gradient(#0B0B0B 0, #0B0B0B ${SY}px, rgba(11,11,11,0) ${SY + 260}px)"></div>`);
      const api = {
        // zoom potong (jump) — maks ~1.1 (Sir rakam lebar)
        cam(t, z = 1) { tl.set("#camWrap", { x: F.x - F.x * z, y: SY + F.y - F.y * z, scale: z }, t); },
        // zoom beranimasi (push-in / pull-out) — muka kekal di tempat sama; z maks ~1.3 supaya kepala tak masuk zon grafik
        push(t0, t1, z0, z1, ease = "sine.inOut") { const P2 = (z) => ({ x: F.x - F.x * z, y: SY + F.y - F.y * z, scale: z });
          tl.fromTo("#camWrap", P2(z0), { ...P2(z1), duration: t1 - t0, ease, immediateRender: false }, t0); },
        // peralihan blur pada video (masuk babak penuh / keluar)
        blur(t, d = 0.3) { tl.to("#camWrap", { filter: "blur(18px)", duration: d / 2, ease: "power2.in" }, t - d / 2); tl.to("#camWrap", { filter: "blur(0px)", duration: d / 2, ease: "power2.out" }, t); },
        // babak penuh skrin (latar warna) dengan blur keluar/masuk
        panel(t, end, html, bg = "#0B0B0B") {
          const n = put(`<div class="L" style="background:${bg}">${html}</div>`, "#fx");
          tl.set(n, { opacity: 0 }, 0);
          tl.fromTo(n, { opacity: 0, filter: "blur(16px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.3, ease: "power2.out", immediateRender: false }, t);
          if (end < D) tl.to(n, { opacity: 0, filter: "blur(16px)", duration: 0.3, ease: "power2.in" }, end - 0.15);
          return n;
        },
        // elemen masuk licin (tiada spring)
        pop(t, end, node, { dy = 40, dur = 0.5 } = {}) {
          tl.set(node, { opacity: 0 }, 0);
          tl.fromTo(node, { opacity: 0, y: dy, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: dur, ease: "power3.out", immediateRender: false }, t);
          if (end < D) tl.to(node, { opacity: 0, y: -16, filter: "blur(6px)", duration: 0.25, ease: "power2.in" }, end - 0.25);
          return node;
        },
        // dedah teks dari bawah (mask)
        reveal(t, node, dur = 0.55) { tl.set(node, { clipPath: "inset(0 0 100% 0)", y: 30 }, 0); tl.to(node, { clipPath: "inset(0 0 0% 0)", y: 0, duration: dur, ease: "power3.out" }, t); },
        strike(t, node) { tl.to(node, { scaleX: 1, duration: 0.3, ease: "power2.out" }, t); },
        type(node, text, t, dt = 0.05) { for (let i = 0; i <= text.length; i++) tl.set(node, { textContent: text.slice(0, i) }, t + i * dt); tl.set(node, { textContent: "" }, 0); },
        counter(node, keys) { const o = { v: keys[0][1] }; node.textContent = keys[0][1];
          for (let i = 1; i < keys.length; i++) tl.to(o, { v: keys[i][1], duration: keys[i][0] - keys[i - 1][0], ease: "power2.out", onUpdate: () => (node.textContent = Math.round(o.v)) }, keys[i - 1][0]); },
      };
      P.scene(tl, api, put);
      // Caption: kotak gelap kecil paras dada, perkataan-demi-perkataan, keyword kuning
      const caps = $("#caps"), W = P.words, KW = new Set((P.keywords || []).map((k) => k.toLowerCase()));
      const hidden = (t) => (P.hideCaps || []).some(([a, b]) => t >= a && t < b);
      const groups = []; let cur = [];
      W.forEach((w, i) => { const p = W[i - 1]; if (cur.length && (cur.length >= 3 || (p && (w.s - p.e > 0.3 || /[.,?!]$/.test(p.w))))) { groups.push(cur); cur = []; } cur.push(w); });
      if (cur.length) groups.push(cur);
      groups.forEach((g, gi) => {
        const t0 = Math.max(g[0].s - 0.04, 0), nx = groups[gi + 1], t1 = nx ? nx[0].s - 0.04 : Math.min(g[g.length - 1].e + 0.3, D);
        if (hidden(t0)) return;
        const n = el(`<div class="cg"><span class="box"></span></div>`); caps.appendChild(n); const box = n.firstChild;
        const RW = new Set((P.redWords || []).map((k) => k.toLowerCase())); const sp = g.map((w) => { const c = w.w.replace(/[.,?!]$/, ""), k = KW.has(c.toLowerCase()), r = RW.has(c.toLowerCase()); const s = el(`<span class="cw${k ? " k" : ""}${r ? " r" : ""}">${c}</span>`); box.appendChild(s); return s; });
        tl.set(n, { opacity: 1 }, t0); tl.set(n, { opacity: 0 }, t1);
        g.forEach((w, i) => tl.set(sp[i], { className: sp[i].className + " on" }, w.s));
      });
      if (P.capStyle) caps.classList.add(P.capStyle);
      window.__timelines = window.__timelines || {}; window.__timelines["main"] = tl; tl.seek(0);
    </script>
  </body>
</html>
