<!doctype html>
<!--
  GAYA DYNAMIC v1 (PREMIUM / rujukan video Apple) — lapisan motion LEGAP 1080x1920.
  Video Sir = "kamera" yang digerakkan: kad bersudut bulat + bayang lembut, expand licin, kad TIP gelap,
  ikon GARISAN SVG dilukis (tiada emoji), tipografi kinetik mask-reveal, belon kaca kabur.
  Gerakan licin sahaja: TIADA lantunan (back.out), TIADA gegaran.
  Easing: masuk power3.out / expo.out .5–.7s · keluar power2.in .3s · transition expo.inOut .6s
  Koreografi per video: scene.js (window.SCENE = function(tl, api){...}) — salin dari projects/<ID>/scene.js.
  Video: assets/base.mp4 (dari base.mov, tanpa audio). Tukar data-duration ikut base.
-->
<html lang="ms" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Montserrat"; font-weight: 800; src: url("assets/montserrat-latin-800-normal.woff2") format("woff2"); }
      @font-face { font-family: "Montserrat"; font-weight: 600; src: url("assets/montserrat-latin-600-normal.woff2") format("woff2"); }
      :root { --green: #25d366; --ink: #050505; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--ink); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Montserrat", sans-serif; perspective: 2400px; }
      .L { position: absolute; inset: 0; }
      #stage { background: var(--ink); }
      #glow { background: radial-gradient(55% 35% at 30% 75%, rgba(255,160,70,.35), rgba(0,0,0,0) 70%),
                          radial-gradient(45% 30% at 80% 25%, rgba(37,211,102,.18), rgba(0,0,0,0) 70%); opacity: 0; }
      #cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; transform-origin: 50% 50%;
        box-shadow: 0 40px 120px rgba(0,0,0,.7); }
      #cam video { width: 100%; height: 100%; object-fit: cover; display: block; }
      #vig { background: radial-gradient(70% 55% at 50% 42%, rgba(0,0,0,0) 40%, rgba(0,0,0,.7) 100%); opacity: 0; }
      .ico { position: absolute; overflow: visible; }
      .ico path, .ico circle, .ico rect { fill: none; stroke: #fff; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
      .ico .acc { stroke: var(--green); }
      .kt { position: absolute; color: #fff; font-weight: 800; line-height: 1.05; letter-spacing: -.02em; }
      .kt .ln { display: block; padding-bottom: .04em; }
      .kt .w { display: inline-block; margin-right: .22em; }
      .kt .g { color: var(--green); }
      .kt.lbl { font-weight: 600; letter-spacing: .22em; color: rgba(255,255,255,.6); }
      #tip { background: var(--ink); opacity: 0; }
      #tip .num { position: absolute; left: 60px; top: 560px; font-weight: 800; font-size: 460px; line-height: .9; letter-spacing: -.04em;
        background: linear-gradient(180deg, #ffffff 10%, var(--green) 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
      #tip .rule { position: absolute; left: 64px; top: 1010px; width: 780px; height: 3px; background: rgba(255,255,255,.25); transform-origin: left; }
      .bub { position: absolute; background: rgba(255,255,255,.16); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
        border: 1.5px solid rgba(255,255,255,.35); color: #fff; font-weight: 600; font-size: 36px; padding: 18px 30px; border-radius: 40px;
        white-space: nowrap; box-shadow: 0 16px 40px rgba(0,0,0,.25); }
    </style>
    <script src="scene.js"></script>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="17.3" data-width="1080" data-height="1920">
      <div id="stage" class="L"></div>
      <div id="glow" class="L"></div>
      <div id="cam"><video id="base" src="assets/base.mp4" class="clip" data-start="0" data-duration="17.3" data-track-index="0" muted playsinline></video></div>
      <div id="vig" class="L"></div>
      <div id="fx"></div>
      <div id="tip" class="L"><div class="num">01</div><div class="rule"></div></div>
      <div id="fx2"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const $ = (s) => document.querySelector(s);
      const el = (h) => { const t = document.createElement("template"); t.innerHTML = h.trim(); return t.content.firstChild; };
      const ICONS = {
        rumah: '<path d="M20 92 L100 28 L180 92"/><path d="M42 76 V172 H158 V76"/><path class="acc" d="M86 172 V124 H114 V172"/>',
        mangkuk: '<path d="M22 104 H178"/><path d="M30 104 C40 170 160 170 170 104"/><path d="M60 104 C70 74 130 74 140 104"/><path class="acc" d="M78 58 C68 44 88 34 78 18"/><path class="acc" d="M100 60 C90 46 110 36 100 20"/><path class="acc" d="M122 58 C112 44 132 34 122 18"/>',
        bulan: '<path d="M128 26 A76 76 0 1 0 172 142 A60 60 0 1 1 128 26 Z"/><path class="acc" d="M150 40 L150 60 M140 50 L160 50"/>',
        kunci: '<rect x="44" y="92" width="112" height="88" rx="14"/><path class="sh" d="M66 92 V64 A34 34 0 0 1 134 64 V92"/><path class="acc" d="M100 124 V148"/>',
        topi: '<path d="M14 74 L100 36 L186 74 L100 112 Z"/><path d="M52 92 V132 C80 152 120 152 148 132 V92"/><path class="acc" d="M186 74 V122"/>',
      };
      const api = {
        icon(t, end, name, x, y, size = 200, opt = {}) {
          const n = el(`<svg class="ico" viewBox="0 0 200 200" width="${size}" height="${size}">${ICONS[name]}</svg>`);
          (opt.top ? $("#fx2") : $("#fx")).appendChild(n); n.style.left = x + "px"; n.style.top = y + "px";
          const parts = n.querySelectorAll("path,circle,rect");
          parts.forEach((p) => { const L = p.getTotalLength(); p.style.strokeDasharray = L; p.style.strokeDashoffset = L; });
          tl.set(n, { opacity: 0 }, 0);
          tl.set(n, { opacity: 1 }, t);
          tl.to(parts, { strokeDashoffset: 0, duration: 0.7, ease: "power2.inOut", stagger: 0.08 }, t);
          tl.fromTo(n, { y: 20 }, { y: 0, duration: 0.7, ease: "power3.out", immediateRender: false }, t);
          tl.to(n, { opacity: 0, duration: 0.3, ease: "power2.in" }, end - 0.3);
          return n;
        },
        type(end, lines, x, y, size = 80, opt = {}) {
          const n = el(`<div class="kt ${opt.cls || ""}"></div>`); (opt.top ? $("#fx2") : $("#fx")).appendChild(n);
          n.style.left = x + "px"; n.style.top = y + "px"; n.style.fontSize = size + "px"; if (opt.w) n.style.width = opt.w + "px";
          lines.forEach((line) => {
            const ln = el(`<span class="ln"></span>`); n.appendChild(ln);
            line.forEach(([txt, cls, t]) => {
              const w = el(`<span class="w ${cls || ""}">${txt}</span>`); ln.appendChild(w);
              // teknik registry "focus-blur-resolve": kabur 16px + skala 1.08 → tajam
              tl.set(w, { opacity: 0 }, 0);
              tl.fromTo(w, { opacity: 0, scale: 1.08, filter: "blur(16px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.52, ease: "power3.out", immediateRender: false }, t);
            });
          });
          tl.to(n, { opacity: 0, filter: "blur(10px)", duration: 0.3, ease: "power2.in" }, end - 0.3);
          return n;
        },
        card(t, o, dur = 0.7) {
          const v = { scale: o.s, x: o.x || 0, y: o.y || 0, rotationY: o.ry || 0, borderRadius: o.r || 56 };
          dur ? tl.to("#cam", { ...v, duration: dur, ease: "expo.inOut" }, t) : tl.set("#cam", v, t);
        },
        full(t, dur = 0.6) { tl.to("#cam", { scale: 1, x: 0, y: 0, rotationY: 0, borderRadius: 0, duration: dur, ease: "expo.inOut" }, t); },
        push(t, dur, to) { tl.to("#cam", { scale: to, duration: dur, ease: "sine.inOut" }, t); },
        tipCard(t, end, num, label, text) {
          $("#tip .num").textContent = num;
          api.type(end, [[[label, "", t + 0.15]]], 64, 500, 30, { cls: "lbl", top: true });
          api.type(end, text.map((ln, i) => ln.map((w, j) => [w[0], w[1], t + 0.3 + i * 0.08 + j * 0.05])), 60, 1040, 72, { top: true });
          tl.to("#cam", { scale: 0.86, filter: "blur(20px)", opacity: 0, duration: 0.35, ease: "power2.in" }, t - 0.05);
          tl.to("#tip", { opacity: 1, duration: 0.25, ease: "power2.out" }, t);
          tl.fromTo("#tip .num", { yPercent: 40, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.6, ease: "expo.out", immediateRender: false }, t + 0.05);
          tl.fromTo("#tip .rule", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "expo.out", immediateRender: false }, t + 0.15);
          tl.to("#tip", { opacity: 0, duration: 0.25, ease: "power2.in" }, end - 0.2);
          tl.fromTo("#cam", { scale: 1.12, filter: "blur(20px)", opacity: 0 }, { scale: 1, filter: "blur(0px)", opacity: 1, duration: 0.5, ease: "expo.out", immediateRender: false }, end - 0.15);
        },
        bubbles(t, end, list) {
          list.forEach(([text, x, y], i) => {
            const n = el(`<div class="bub">${text}</div>`); $("#fx").appendChild(n);
            n.style.left = x + "px"; n.style.top = y + "px";
            tl.set(n, { opacity: 0 }, 0);
            tl.fromTo(n, { opacity: 0, scale: 0.85, y: 24 }, { opacity: 1, scale: 1, y: 0, duration: 0.45, ease: "power3.out", immediateRender: false }, t + i * 0.09);
            tl.to(n, { opacity: 0, y: -16, duration: 0.3, ease: "power2.in" }, end - 0.3);
          });
        },
      };
      window.SCENE(tl, api);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
