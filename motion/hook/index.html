<!doctype html>
<!--
  HOOK SURPRISE "Mimpi vs Realiti" — Gaya v2+ (1080x1920). Sir bercakap dari saat 0 (muka dalam bulatan).
  0 → twist : mockup telefon generik, notifikasi ORDER mencurah-curah (ka-ching), kaunter jualan naik
  twist     : skrin retak/glitch + record scratch, semua order jadi kelabu & jatuh, tinggal "Seen ✓✓" + "…tu mimpi je 😅"
  out       : sapuan hijau → A-roll (punch-in muka + headline dari overlay)
  Variables: twist, out (saat), face (klip muka), orders (JSON [t,...] masa notifikasi)
  Render: npx hyperframes render --variables '{...}' -f 30 -q high -w 4 -o hook.mp4 → trim ffmpeg -t <out+0.25>
  Zon: teks x 60–900, y 250–1250.
-->
<html lang="ms" data-resolution="portrait"
  data-composition-variables='[
    {"id":"twist","type":"number","label":"Masa twist","default":2.45},
    {"id":"out","type":"number","label":"Masa keluar","default":2.82},
    {"id":"face","type":"string","label":"Klip muka","default":"assets/face_hook.mp4"},
    {"id":"orders","type":"string","label":"Masa notifikasi","default":"[0.15,0.55,0.95,1.3,1.6,1.85,2.1]"}
  ]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Montserrat"; font-weight: 800; src: url("assets/montserrat-latin-800-normal.woff2") format("woff2"); }
      @font-face { font-family: "Montserrat"; font-weight: 600; src: url("assets/montserrat-latin-600-normal.woff2") format("woff2"); }
      @font-face { font-family: "Caveat"; font-weight: 700; src: url("assets/caveat-latin-700-normal.woff2") format("woff2"); }
      @font-face { font-family: "Noto Color Emoji"; src: local("Noto Color Emoji"); }
      :root { --green: #25d366; --deep: #0b3d2e; --yellow: #ffd60a; --ink: #0b0b0b; --red: #ff5a5a; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Montserrat", "Noto Color Emoji", sans-serif; }
      #stage { position: absolute; inset: 0; background: radial-gradient(90% 60% at 50% 42%, #0f5a40 0%, #06180f 100%); }
      #gold { position: absolute; inset: 0; background: radial-gradient(60% 40% at 50% 55%, rgba(255,214,10,.28), transparent 70%); }
      #faceWrap { position: absolute; left: 60px; top: 250px; width: 430px; height: 430px; border-radius: 50%; overflow: hidden; border: 7px solid #fff; box-shadow: 0 16px 40px rgba(0,0,0,.45); }
      #face { width: 100%; height: 100%; object-fit: cover; }
      #sales { position: absolute; left: 520px; top: 370px; color: #fff; }
      #sales small { display: block; font-family: "Caveat", cursive; font-weight: 700; font-size: 54px; line-height: 1; opacity: .9; }
      #sales b { display: block; font-weight: 800; font-size: 80px; color: var(--yellow); line-height: 1.05; white-space: nowrap; }
      #phone { position: absolute; left: 50%; top: 720px; width: 700px; height: 470px; margin-left: -350px; border-radius: 48px; background: #f3f5f4; border: 14px solid #101512; box-shadow: 0 30px 80px rgba(0,0,0,.55); overflow: hidden; }
      #feed { position: absolute; left: 18px; right: 18px; bottom: 18px; display: flex; flex-direction: column-reverse; gap: 14px; }
      .n { display: flex; align-items: center; gap: 18px; background: #fff; border-radius: 22px; padding: 16px 20px; box-shadow: 0 4px 12px rgba(0,0,0,.1); }
      .n .ic { width: 64px; height: 64px; border-radius: 16px; background: var(--green); display: flex; align-items: center; justify-content: center; font-size: 36px; flex: none; }
      .n b { display: block; font-weight: 800; font-size: 30px; color: #13201a; } .n small { font-weight: 600; font-size: 25px; color: #5d6b64; }
      #seen { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); background: #fff; border-radius: 24px; padding: 20px 30px; font-weight: 700; font-size: 44px; color: #13201a; white-space: nowrap; box-shadow: 0 6px 16px rgba(0,0,0,.15); }
      #seen span { color: #34b7f1; font-weight: 800; }
      #crack { position: absolute; inset: 0; width: 100%; height: 100%; }
      #crack path { fill: none; stroke: rgba(255,255,255,.9); stroke-width: 4; stroke-linecap: round; }
      #dream { position: absolute; left: 60px; width: 840px; top: 1196px; text-align: center; font-family: "Caveat", cursive; font-weight: 700; font-size: 92px; color: var(--yellow); text-shadow: 0 4px 18px rgba(0,0,0,.6); }
      #glitch { position: absolute; inset: 0; mix-blend-mode: screen; background: repeating-linear-gradient(0deg, rgba(255,0,80,.18) 0 6px, rgba(0,255,220,.12) 6px 12px); }
      #flash { position: absolute; inset: 0; background: #fff; }
      #wipe, #wipe2 { position: absolute; top: -100px; left: 0; width: 1700px; height: 2120px; transform: translateX(-1900px) skewX(-8deg); }
      #wipe { background: var(--green); } #wipe2 { background: #0b0b0b; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1080" data-height="1920">
      <div id="stage" class="clip" data-start="0" data-duration="5" data-track-index="0">
        <div id="gold"></div>
        <div id="sales"><small>jualan hari ni</small><b>RM<span id="amt">0</span></b></div>
        <div id="phone"><div id="feed"></div><div id="seen">Customer · <span>Seen ✓✓</span></div>
          <svg id="crack" viewBox="0 0 700 470" preserveAspectRatio="none"><path d="M350 300 L300 180 L320 60 L290 0"/><path d="M350 300 L470 240 L560 260 L700 200"/><path d="M350 300 L380 430 L330 560 L360 660"/><path d="M350 300 L220 340 L120 320 L0 380"/><path d="M350 300 L430 360 L520 470"/></svg></div>
        <div id="dream">…tu mimpi je 😅</div>
        <div id="glitch"></div>
      </div>
      <div id="faceWrap"><video id="face" src="assets/face_hook.mp4" class="clip" data-start="0" data-duration="5" data-track-index="1" muted playsinline></video></div>
      <div id="flash" class="clip" data-start="0" data-duration="5" data-track-index="2"></div>
      <div id="wipe2" class="clip" data-start="0" data-duration="5" data-track-index="3"></div>
      <div id="wipe" class="clip" data-start="0" data-duration="5" data-track-index="4"></div>
    </div>
    <script>
      const V = window.__hyperframes.getVariables();
      const $ = (s) => document.querySelector(s);
      const TW = Number(V.twist) || 2.45, OUT = Number(V.out) || 2.82, ORD = JSON.parse(V.orders);
      $("#face").setAttribute("src", V.face);
      const tl = gsap.timeline({ paused: true });
      const ITEMS = [["Order baru! 🎉", "Choco Jar x2 · RM58"], ["Order baru! 🎉", "Choco Jar x5 · RM145"], ["Bayaran diterima 💸", "RM89.00"],
        ["Order baru! 🎉", "Choco Jar x3 · RM87"], ["Bayaran diterima 💸", "RM174.00"], ["Order baru! 🎉", "Choco Jar x10 · RM290"], ["Order baru! 🎉", "Choco Jar x4 · RM116"]];
      const feed = $("#feed"), els = [];
      ORD.forEach((t, i) => {
        const it = ITEMS[i % ITEMS.length], el = document.createElement("div"); el.className = "n";
        el.innerHTML = `<span class="ic">🛍️</span><div><b>${it[0]}</b><small>${it[1]}</small></div>`; feed.appendChild(el); els.push(el);
        tl.set(el, { display: "none" }, 0); tl.set(el, { display: "flex" }, t);
        tl.fromTo(el, { y: -60, opacity: 0, scale: 0.9 }, { y: 0, opacity: 1, scale: 1, duration: 0.2, ease: "back.out(2)" }, t);
      });
      // kaunter jualan naik
      const o = { v: 0 }, amt = $("#amt");
      tl.to(o, { v: 1279, duration: TW - ORD[0], ease: "power1.in", onUpdate: () => (amt.textContent = Math.round(o.v).toLocaleString("en")) }, ORD[0]);
      tl.fromTo("#sales", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.25 }, 0.05);
      tl.fromTo("#phone", { y: 300, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, 0);
      tl.fromTo("#faceWrap", { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(1.8)" }, 0);
      tl.fromTo("#gold", { opacity: 0 }, { opacity: 1, duration: TW, ease: "power1.in" }, 0);
      // TWIST
      tl.set(["#seen", "#crack", "#dream", "#glitch", "#flash"], { opacity: 0 }, 0);
      tl.fromTo("#flash", { opacity: 0.85 }, { opacity: 0, duration: 0.18 }, TW);
      tl.set("#glitch", { opacity: 1 }, TW); tl.to("#glitch", { opacity: 0, duration: 0.25, ease: "steps(4)" }, TW + 0.05);
      tl.to("#stage", { x: 22, duration: 0.04, yoyo: true, repeat: 5 }, TW);
      tl.set("#gold", { opacity: 0 }, TW);
      tl.set("#phone", { filter: "saturate(0.1) brightness(0.85)" }, TW); tl.set("#stage", { background: "radial-gradient(90% 60% at 50% 42%, #2a2f2c 0%, #0b0d0c 100%)" }, TW);
      tl.set("#crack", { opacity: 1 }, TW);
      document.querySelectorAll("#crack path").forEach((p) => { const L = p.getTotalLength(); tl.fromTo(p, { strokeDasharray: L, strokeDashoffset: L }, { strokeDashoffset: 0, duration: 0.12 }, TW); });
      tl.to(els, { y: 900, rotation: () => gsap.utils.random(-25, 25), opacity: 0, duration: 0.22, ease: "power2.in", stagger: 0.015 }, TW + 0.02);
      tl.set(amt, { textContent: "0" }, TW); tl.set("#sales b", { color: "#ff5a5a" }, TW);
      tl.fromTo("#seen", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.15, ease: "back.out(2.4)" }, TW + 0.08);
      tl.fromTo("#dream", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.12 }, TW + 0.1);
      // keluar ke A-roll
      tl.fromTo("#wipe2", { x: -1900 }, { x: 1300, duration: 0.4, ease: "none" }, OUT - 0.25);
      tl.fromTo("#wipe", { x: -1900 }, { x: 1300, duration: 0.4, ease: "none" }, OUT - 0.2);
      tl.set(["#stage", "#faceWrap"], { opacity: 0 }, OUT);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
