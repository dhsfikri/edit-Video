  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1080" data-height="1920">
      <div id="stage" class="clip" data-start="0" data-duration="12" data-track-index="0">
        <div id="dots"></div>
        <svg id="curves" viewBox="0 0 1080 1920"><path id="c1" d="M-60 520 C 260 380, 420 140, 760 90" /><path id="c2" d="M1140 1500 C 900 1560, 760 1700, 620 1990" /></svg>
        <div id="head"></div>
        <div id="card"><div id="books"></div><div id="list"><div id="rail"></div></div></div>
        <div id="phone"><div class="scr"><div class="notch"></div><div id="feed"></div></div></div>
        <div id="grid"></div>
        <div id="crowd"></div>
        <div id="big"></div>
        <div id="tline"><div id="tl-rail"></div><div class="yr" id="y1"><b>2020</b><span>VERSI PERTAMA</span></div><div class="yr" id="y2"><b>2026</b><span>HARI INI</span></div><div id="stampR">✓ MASIH RELEVAN</div></div>
        <div id="team"><div class="ppl"><div class="pp"><i></i><u></u><em>✓</em></div><div class="pp"><i></i><u></u><em>✓</em></div><div class="pp"><i></i><u></u><em>✓</em></div></div><div id="teamLbl">GUIDE <mark>TEAM</mark> AWAK</div></div>
        <div id="plus"></div>
        <div id="btn"></div>
        <div id="ring"></div>
        <svg id="cursor" viewBox="0 0 24 24"><path d="M4 2 L4 19 L8.5 14.8 L11.6 21.5 L14.4 20.3 L11.4 13.7 L17.6 13.7 Z" fill="#0b0b0b" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/></svg>
      </div>
      <div id="faceWrap"><video id="face" src="assets/face_ebook.mp4" class="clip" data-start="0" data-duration="12" data-track-index="1" muted playsinline></video></div>
    </div>
    <script>
      const V = window.__hyperframes.getVariables();
      const D = Number(V.dur) || 7;
      const $ = (s) => document.querySelector(s);
      $("#face").setAttribute("src", V.face);

      // Babak. Masa (s) relatif kepada mula babak — selaraskan dengan words.json.
      //  books: [[t, vol, tajuk, isNew]] · items: [[t, html]] · btn: [t, teks] · tap: t · plus: [t, teks]
      const SCENES = {
        ebook: {
          head: "<i>/</i>ISI 3 E-BOOK", face: [690, 205, 200],
          books: [[0.25, "VOL.1", "Learning<br>Lab", 0], [0.45, "VOL.2", "Learning<br>Lab", 0], [0.65, "VOL.3", "Learning<br>Lab", 0]],
          items: [[1.69, "<span>Template closing</span>"], [2.59, "<span>SOP closing</span>"], [5.0, "<span>Khas closing guna <mark>WhatsApp</mark></span>"]],
        },
        timeline: { type: "timeline", head: "<i>/</i>VERSI PERTAMA", face: [690, 205, 200], books: [], items: [], at: [0.2, 3.75, 4.2] },
        team: { type: "team", head: "<i>/</i>UNTUK TEAM", face: [690, 205, 200], books: [], items: [], at: [0.3, 1.85, 2.2] },
        malam: { type: "malam", head: "<i>/</i>BUKAN", face: [690, 205, 200], books: [], items: [], at: [1.5] },
        lapan: { type: "lapan", head: "<i>/</i>SEBENARNYA", face: [690, 205, 200], books: [], items: [], at: [0.4, 0.9] },
        banding: { type: "banding", head: "<i>/</i>INGAT", face: [690, 205, 200], books: [], items: [], at: [0.35, 0.55] },
        tangga: { type: "tangga", head: "<i>/</i>TERUS", face: [690, 205, 200], books: [], items: [], at: [0.9] },
        crowd: { type: "crowd", books: [], items: [] },
        live: { type: "live", books: [], items: [], at: [1.38, 1.95, 3.3] },
        phone: { type: "phone", books: [], items: [] },
        grid: { type: "grid", books: [], items: [], tiles: [0.25, 0.4, 0.55, 0.9, 1.05, 1.2] },
        bonus: {
          head: "<i>/</i>BONUS",
          books: [[0.15, "VOL.1", "", 0], [0.25, "VOL.2", "", 0], [0.35, "VOL.3", "", 0], [4.4, "E-BOOK #4", "Terbaru<br>&amp; lebih<br>mudah", 1]],
          items: [],
          btn: [1.0, "LEARN MORE ➜"], tap: 2.4,
          plus: [4.55, "+1 E-BOOK 🎁"],
        },
      };
      const sc = SCENES[V.scene] || SCENES.ebook;
      if (sc.face) { const f = $("#faceWrap").style; [f.left, f.top, f.width, f.height] = [sc.face[0] + "px", sc.face[1] + "px", sc.face[2] + "px", sc.face[2] + "px"]; }
      const tl = gsap.timeline({ paused: true });

      // latar hidup: grid bergerak perlahan + garis putus-putus mengalir
      tl.fromTo("#dots", { x: 0, y: 0 }, { x: -34, y: -34, duration: D, ease: "none" }, 0);
      tl.fromTo("#curves path", { strokeDashoffset: 0 }, { strokeDashoffset: -280, duration: D, ease: "none" }, 0);

      // masuk: header + kad zoom dari kecil dengan kabur (gaya reference)
      $("#head").innerHTML = sc.head || "";
      tl.fromTo("#head", { opacity: 0, x: -60, filter: "blur(12px)" }, { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.3, ease: "power3.out" }, 0.02);
      tl.fromTo("#card", { scale: 0.55, opacity: 0, filter: "blur(18px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.38, ease: "back.out(1.4)" }, 0.0);
      tl.fromTo("#faceWrap", { scale: 0, rotation: -20 }, { scale: 1, rotation: 0, duration: 0.35, ease: "back.out(1.8)" }, 0.1);

      const books = $("#books");
      if (sc.books.some((b) => b[3])) books.style.gap = "16px";
      sc.books.forEach(([t, vol, name, isNew]) => {
        const b = document.createElement("div");
        b.className = "bk" + (isNew ? " new" : "");
        if (sc.books.length > 3) { b.style.width = "165px"; b.style.height = isNew ? "340px" : "280px"; }
        b.innerHTML = `<b>${vol}</b><span>${name}</span>${isNew ? "" : "<em>✓</em>"}`;
        books.appendChild(b);
        tl.set(b, { opacity: 0 }, 0);
        tl.fromTo(b, { opacity: 0, y: -160, rotation: isNew ? 12 : -6, filter: "blur(10px)" },
          { opacity: 1, y: 0, rotation: 0, filter: "blur(0px)", duration: 0.32, ease: "back.out(1.7)" }, t);
        if (isNew) tl.to(b, { scale: 1.06, duration: 0.18, yoyo: true, repeat: 3, ease: "sine.inOut" }, t + 0.35);
      });

      // senarai tumbuh + rel menegak
      const list = $("#list");
      if (!sc.items.length) list.style.display = "none";
      sc.items.forEach(([t, html], i) => {
        const it = document.createElement("div");
        it.className = "it"; it.innerHTML = `<div class="dot">✓</div>${html}`;
        list.appendChild(it);
        tl.set(it, { opacity: 0 }, 0);
        tl.fromTo(it, { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.25, ease: "power3.out" }, t);
        tl.fromTo(it.querySelector(".dot"), { scale: 0 }, { scale: 1, duration: 0.25, ease: "back.out(3)" }, t);
        tl.to("#rail", { height: 22 + i * 90, duration: 0.25, ease: "power2.out" }, t);
      });

      // butang + tap cursor
      ["#btn", "#cursor", "#ring", "#plus"].forEach((s) => tl.set(s, { opacity: 0 }, 0));
      if (sc.btn) {
        $("#btn").textContent = sc.btn[1];
        tl.fromTo("#btn", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.2)" }, sc.btn[0]);
        tl.to("#btn", { scale: 1.05, duration: 0.35, yoyo: true, repeat: 1, ease: "sine.inOut" }, sc.btn[0] + 0.35);
        tl.fromTo("#cursor", { opacity: 0, x: 220, y: 260 }, { opacity: 1, x: 0, y: 0, duration: 0.45, ease: "power3.out" }, sc.tap - 0.5);
        tl.to("#cursor", { scale: 0.82, duration: 0.08, yoyo: true, repeat: 1 }, sc.tap);
        tl.to("#btn", { scale: 0.94, duration: 0.08, yoyo: true, repeat: 1 }, sc.tap);
        tl.fromTo("#ring", { opacity: 1, scale: 0.4 }, { opacity: 0, scale: 1.8, duration: 0.45, ease: "power2.out" }, sc.tap);
        tl.to(["#btn", "#cursor"], { opacity: 0, y: 40, duration: 0.2 }, sc.plus ? sc.plus[0] - 0.4 : D);
      }
      if (sc.plus) {
        $("#plus").textContent = sc.plus[1];
        tl.fromTo("#plus", { opacity: 0, scale: 2.4, rotation: -10 }, { opacity: 1, scale: 1, rotation: 4, duration: 0.28, ease: "power4.in" }, sc.plus[0]);
        tl.to("#card", { x: 8, duration: 0.05, yoyo: true, repeat: 3 }, sc.plus[0] + 0.28);
      }

      if (sc.type === "timeline" || sc.type === "team") { ["#card", "#plus"].forEach((q) => ($(q).style.display = "none")); }
      if (sc.type === "timeline") {
        $("#tline").style.display = "block";
        tl.fromTo("#y1", { scale: 0.4, opacity: 0, filter: "blur(14px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.32, ease: "back.out(1.7)" }, sc.at[0]);
        tl.set(["#y2", "#stampR"], { opacity: 0 }, 0);
        tl.to("#tl-rail", { width: 160, duration: 0.5, ease: "power2.inOut" }, sc.at[1]);
        tl.fromTo("#y2", { scale: 0.4, opacity: 0, x: 120 }, { scale: 1, opacity: 1, x: 0, duration: 0.3, ease: "back.out(1.7)" }, sc.at[1] + 0.35);
        const yr = { v: 2020 }; tl.to(yr, { v: 2026, duration: 0.5, ease: "power1.out", onUpdate: () => ($("#y2 b").textContent = Math.round(yr.v)) }, sc.at[1] + 0.35);
        tl.fromTo("#stampR", { opacity: 0, scale: 2.4 }, { opacity: 1, scale: 1, duration: 0.25, ease: "power4.in" }, sc.at[2]);
        tl.to("#tline", { x: 8, duration: 0.05, yoyo: true, repeat: 3 }, sc.at[2] + 0.25);
      }
      if (sc.type === "team") {
        $("#team").style.display = "block";
        document.querySelectorAll(".pp").forEach((n, k) => {
          tl.fromTo(n, { opacity: 0, y: 220, rotation: k === 1 ? 0 : (k ? 10 : -10) }, { opacity: 1, y: 0, rotation: 0, duration: 0.3, ease: "back.out(1.8)" }, sc.at[0] + k * 0.15);
          tl.fromTo(n.querySelector("em"), { scale: 0 }, { scale: 1, duration: 0.22, ease: "back.out(3)" }, sc.at[1] + k * 0.12);
        });
        tl.fromTo("#teamLbl", { opacity: 0, scale: 2, filter: "blur(12px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.25, ease: "back.out(1.6)" }, sc.at[2]);
      }

      if (sc.type === "crowd") {
        ["#card", "#plus", "#faceWrap"].forEach((q) => ($(q).style.display = "none"));
        const c = $("#crowd"); c.style.display = "grid";
        for (let k = 0; k < 12; k++) {
          c.insertAdjacentHTML("beforeend", `<div class="cp${k === 5 ? " hl" : ""}"><i></i><u></u></div>`);
          const el = c.lastElementChild; tl.set(el, { opacity: 0 }, 0);
          tl.fromTo(el, { opacity: 0, scale: 0.2, y: 120 }, { opacity: 1, scale: 1, y: 0, duration: 0.22, ease: "back.out(2)" }, 0.05 + k * 0.05);
        }
        tl.to("#crowd .cp:not(.hl)", { x: (i) => (i % 4 < 2 ? 12 : -12), duration: 0.4, ease: "sine.inOut" }, 0.8); // semua condong ke tengah
      }
      if (sc.type === "live") {
        ["#card", "#plus", "#faceWrap"].forEach((q) => ($(q).style.display = "none"));
        const ph = $("#phone"); ph.classList.add("live"); ph.style.display = "block";
        ph.querySelector(".scr").innerHTML = `<div class="notch"></div><div id="lv-top"><b>● LIVE</b><span>👁 12.4K</span></div>
          <div id="lv-lbl">JUALAN</div><div id="lv-rm">RM 0</div><div id="lv-time">⏱ 00:00</div><div id="lv-sold">🔥 TERJUAL!</div>`;
        tl.fromTo(ph, { y: 900, rotation: -8 }, { y: 0, rotation: 2, duration: 0.3, ease: "power3.out" }, 0);
        const rm = { v: 0 }, fmt = (n) => "RM " + Math.round(n).toLocaleString("en-US");
        tl.to(rm, { v: 1000000, duration: sc.at[1] - sc.at[0], ease: "power3.in", onUpdate: () => ($("#lv-rm").textContent = fmt(rm.v)) }, sc.at[0]);
        tl.to("#lv-rm", { scale: 1.25, duration: 0.15, yoyo: true, repeat: 1 }, sc.at[1]);
        const tm = { v: 0 }; tl.to(tm, { v: 180, duration: sc.at[2] - 0.2, ease: "none", onUpdate: () => {
          const m = Math.floor(tm.v / 60), sx = Math.round(tm.v % 60); $("#lv-time").textContent = `⏱ 0${m}:${sx < 10 ? "0" : ""}${sx}`; } }, 0.2);
        tl.set("#lv-sold", { opacity: 0 }, 0);
        tl.fromTo("#lv-sold", { opacity: 0, scale: 2 }, { opacity: 1, scale: 1, duration: 0.2, ease: "back.out(2)" }, sc.at[1] + 0.1);
        tl.to("#phone", { x: 10, duration: 0.05, yoyo: true, repeat: 3 }, sc.at[1]);
      }

      if (["malam", "lapan", "banding", "tangga"].includes(sc.type)) {
        ["#card", "#plus"].forEach((q) => ($(q).style.display = "none"));
        const B = $("#big"); B.style.display = "block"; const a = sc.at;
        const pop = (q, t) => tl.fromTo(q, { opacity: 0, scale: 0.3, filter: "blur(12px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.28, ease: "back.out(1.8)" }, t);
        if (sc.type === "malam") {
          B.innerHTML = `<div class="bigc"><div class="em">🌙</div><b>SATU MALAM</b></div><div class="xst">✕</div>`;
          pop("#big .bigc", 0.05); tl.set("#big .xst", { opacity: 0 }, 0);
          tl.fromTo("#big .xst", { opacity: 0, scale: 3 }, { opacity: 1, scale: 1, duration: 0.22, ease: "power4.in" }, a[0]);
          tl.to("#big .bigc", { x: 10, duration: 0.05, yoyo: true, repeat: 3 }, a[0] + 0.22);
        }
        if (sc.type === "lapan") {
          B.innerHTML = `<div class="bigc"><div class="cnt">3 MINIT</div></div><div class="dots">${[...Array(8)].map((_, k) => `<i>${k + 1}</i>`).join("")}</div>`;
          pop("#big .bigc", 0.05);
          tl.to("#big .cnt", { rotationX: 90, duration: 0.15, ease: "power2.in" }, a[0]);
          tl.call(() => { const c = $("#big .cnt"); c.textContent = "8 TAHUN"; c.classList.add("y"); }, null, a[0] + 0.15);
          tl.call(() => { const c = $("#big .cnt"); c.textContent = "3 MINIT"; c.classList.remove("y"); }, null, a[0] + 0.149); // seek ke belakang
          tl.fromTo("#big .cnt", { rotationX: -90 }, { rotationX: 0, duration: 0.2, ease: "back.out(2)" }, a[0] + 0.15);
          document.querySelectorAll("#big .dots i").forEach((d, k) => tl.to(d, { background: "#25d366", scale: 1.15, duration: 0.12, yoyo: true, repeat: 1 }, a[1] + k * 0.12));
          document.querySelectorAll("#big .dots i").forEach((d, k) => tl.set(d, { background: "#25d366" }, a[1] + k * 0.12 + 0.24));
        }
        if (sc.type === "banding") {
          B.innerHTML = `<div class="duo"><div class="pp"><i></i><u></u></div><div class="neq">≠</div><div class="pp" style="opacity:.55"><i></i><u></u></div></div><div class="lbl">JANGAN <mark>BANDING</mark></div>`;
          tl.fromTo("#big .pp", { opacity: 0, y: 200 }, { opacity: (i) => (i ? 0.55 : 1), y: 0, duration: 0.3, stagger: 0.15, ease: "back.out(1.8)" }, 0.05);
          pop("#big .neq", a[0]); tl.set(["#big .neq", "#big .lbl"], { opacity: 0 }, 0); pop("#big .lbl", a[1]);
        }
        if (sc.type === "tangga") {
          let h = ""; for (let k = 0; k < 5; k++) h += `<div class="stp" style="left:${30 + k * 155}px;height:${80 + k * 90}px"></div>`;
          B.innerHTML = h + `<div class="hop"><i></i><u></u></div><div class="lbl" style="top:640px">TERUS <mark>USAHA</mark> 💪</div>`;
          tl.fromTo("#big .stp", { scaleY: 0, transformOrigin: "50% 100%" }, { scaleY: 1, duration: 0.25, stagger: 0.07, ease: "power3.out" }, 0.05);
          const pos = (k) => ({ left: 50 + k * 155 + "px", top: 860 - 260 - (80 + k * 90) - 150 + "px" });
          tl.set("#big .hop", pos(0), 0);
          for (let k = 1; k < 5; k++) tl.to("#big .hop", { ...pos(k), duration: 0.22, ease: "power2.out" }, 0.4 + k * 0.25);
          tl.set("#big .lbl", { opacity: 0 }, 0); pop("#big .lbl", a[0]);
        }
      }

      // Babak jenis khas (motion graphic penuh, tiada kad)
      if (sc.type === "phone" || sc.type === "grid") {
        ["#card", "#head", "#faceWrap"].forEach((q) => ($(q).style.display = "none"));
      }
      if (sc.type === "phone") {
        $("#phone").style.display = "block";
        const feed = $("#feed");
        for (let k = 0; k < 8; k++) feed.insertAdjacentHTML("beforeend", `<div class="ad"><img src="assets/thumbs/t${(k % 6) + 1}.jpg"><div class="meta"><i></i><b></b><em>Iklan</em></div></div>`);
        tl.fromTo("#phone", { y: 900, rotation: 8 }, { y: 0, rotation: -3, duration: 0.3, ease: "power3.out" }, 0);
        tl.fromTo("#feed", { y: 0 }, { y: -2400, duration: D - 0.15, ease: "power2.in" }, 0.15); // scroll laju
      }
      if (sc.type === "grid") {
        const g = $("#grid"); g.style.display = "grid";
        (sc.tiles || []).forEach((t, k) => {
          g.insertAdjacentHTML("beforeend", `<div class="tile"><img src="assets/thumbs/t${(k % 6) + 1}.jpg"><div class="pl">▶</div></div>`);
          const el = g.lastElementChild;
          tl.set(el, { opacity: 0 }, 0);
          tl.fromTo(el, { opacity: 0, scale: 0.3, rotation: k % 2 ? 14 : -14, y: 200, filter: "blur(12px)" },
            { opacity: 1, scale: 1, rotation: 0, y: 0, filter: "blur(0px)", duration: 0.3, ease: "back.out(1.8)" }, t);
        });
        tl.to("#grid", { scale: 1.06, duration: D, ease: "none" }, 0); // hanyut perlahan
      }

      // keluar: whip kabur ke kiri (0.22s terakhir) — peralihan balik ke A-roll
      tl.to(["#card", "#head", "#plus", "#faceWrap", "#phone", "#grid", "#tline", "#team", "#crowd", "#big"], { x: -500, opacity: 0, filter: "blur(16px)", duration: 0.22, ease: "power2.in" }, D - 0.22);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
