<!doctype html>
<!--
  Overlay GAYA v2 (telus, 1080x1920) — ditindih atas A-roll + B-roll dengan FFmpeg.
  Elemen (semua dari data.js → window.EDIT):
    badge     : badge siri kecil kiri-atas (disembunyi dalam julat `hideBadge`)
    titles    : tajuk kinetik kiri-atas. Setiap kumpulan = baris; setiap baris = token {t, text, k}
                k: "script" (tulisan tangan) | "bold" | "box" (kotak putih, ditaip huruf demi huruf)
    brackets  : bracket fokus 4 sudut {start, end, box:[x,y,w,h]}
    callouts  : pil kecil {t, end, x, y, text, kind:"ok"|"no"|"tag"}
    words     : subtitle kecil bawah, perkataan aktif dalam kotak hijau (karaoke)
    cta       : pil CTA kecil {start, text}
-->
<html lang="ms" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <script src="data.js"></script>
    <style>
      @font-face { font-family: "Montserrat"; font-weight: 800; src: url("assets/montserrat-latin-800-normal.woff2") format("woff2"); }
      @font-face { font-family: "Montserrat"; font-weight: 600; src: url("assets/montserrat-latin-600-normal.woff2") format("woff2"); }
      @font-face { font-family: "Caveat"; font-weight: 700; src: url("assets/caveat-latin-700-normal.woff2") format("woff2"); }
      @font-face { font-family: "Noto Color Emoji"; src: local("Noto Color Emoji"); }
      :root { --green: #25d366; --deep: #0b3d2e; --white: #fff; --ink: #0b0b0b; --red: #ff6b6b; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; font-family: "Montserrat", "Noto Color Emoji", sans-serif; }
      .shadow { filter: drop-shadow(0 4px 14px rgba(0,0,0,.45)); }

      #badge { position: absolute; left: 60px; top: 150px; display: flex; align-items: center; gap: 10px; padding: 8px 18px 8px 14px;
        border-radius: 999px; background: rgba(11,11,11,.55); border: 2px solid rgba(37,211,102,.8); }
      #badge i { width: 14px; height: 14px; border-radius: 50%; background: var(--green); }
      #badge b { color: #fff; font-size: 24px; letter-spacing: .06em; } #badge b span { color: var(--green); }

      .title { position: absolute; left: 60px; top: 220px; }
      .tl { display: block; white-space: nowrap; line-height: 1.05; margin-bottom: 6px; }
      .tk { display: inline-block; margin-right: 14px; vertical-align: bottom; }
      .tk.script { font-family: "Caveat", cursive; font-weight: 700; font-size: 54px; color: #fff; }
      .tk.bold { font-weight: 800; font-size: 66px; color: #fff; }
      .tk.box { font-weight: 800; font-size: 80px; color: var(--deep); background: #fff; padding: 0 18px; border-radius: 10px; overflow: hidden; white-space: nowrap; }

      .br { position: absolute; width: 58px; height: 58px; border-color: #fff; border-style: solid; border-width: 0; }
      .br.tl0 { border-top-width: 7px; border-left-width: 7px; } .br.tr0 { border-top-width: 7px; border-right-width: 7px; }
      .br.bl0 { border-bottom-width: 7px; border-left-width: 7px; } .br.br0 { border-bottom-width: 7px; border-right-width: 7px; }

      .co { position: absolute; display: flex; align-items: center; gap: 10px; background: #fff; color: var(--ink); font-weight: 800; font-size: 34px;
        padding: 10px 22px 10px 14px; border-radius: 16px; white-space: nowrap; }
      .co .ic { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 26px; color: #fff; }
      .co.ok .ic { background: var(--green); } .co.no { background: rgba(20,20,20,.78); color: #fff; } .co.no .ic { background: var(--red); }
      .co.tag .ic { display: none; } .co.tag { padding: 8px 18px; font-size: 30px; }

      #subs { position: absolute; left: 50px; right: 50px; top: 1470px; height: 90px; }
      .grp { position: absolute; left: 0; right: 0; top: 0; text-align: center; }
      .sw { display: inline-block; margin: 0 2px; padding: 2px 10px; border-radius: 10px; font-weight: 800; font-size: 46px; color: #fff;
        text-shadow: 0 3px 10px rgba(0,0,0,.6); }
      .sw.on { background: var(--green); color: var(--ink); text-shadow: none; }

      #cta { position: absolute; left: 0; right: 0; top: 1330px; text-align: center; }
      #cta span { display: inline-block; background: #fff; color: var(--deep); font-weight: 800; font-size: 36px; padding: 14px 30px; border-radius: 999px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="20" data-width="1080" data-height="1920">
      <div id="layer" class="clip" data-start="0" data-duration="20" data-track-index="0"></div>
    </div>
    <script>
      const E = window.EDIT, D = E.duration;
      const layer = document.getElementById("layer");
      const tl = gsap.timeline({ paused: true });
      const el = (h) => { const t = document.createElement("template"); t.innerHTML = h.trim(); return t.content.firstChild; };
      const put = (h) => layer.appendChild(el(h));

      // Badge siri
      const badge = put(`<div id="badge"><i></i><b>${E.series} <span>#${E.episode}</span></b></div>`);
      tl.fromTo(badge, { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.3 }, 0);
      (E.hideBadge || []).forEach(([a, b]) => { tl.set(badge, { opacity: 0 }, a); if (b < D) tl.set(badge, { opacity: 1 }, b); });

      // Tajuk kinetik
      (E.titles || []).forEach((g) => {
        const box = put(`<div class="title shadow"></div>`);
        if (g.start > 0) { tl.set(box, { opacity: 0 }, 0); tl.set(box, { opacity: 1 }, g.start); }
        g.lines.forEach((line) => {
          const ln = el(`<span class="tl"></span>`); box.appendChild(ln);
          line.forEach((tok) => {
            const s = el(`<span class="tk ${tok.k}">${tok.text}</span>`); ln.appendChild(s);
            if (tok.k === "box") {
              const w = s.getBoundingClientRect().width, n = tok.text.length;
              tl.set(s, { opacity: 0 }, 0);
              tl.fromTo(s, { opacity: 1, width: 0, paddingLeft: 0, paddingRight: 0 },
                { width: w, paddingLeft: 18, paddingRight: 18, duration: Math.min(0.06 * n, 0.4), ease: `steps(${n})` }, tok.t);
            } else {
              tl.fromTo(s, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.18, ease: "power2.out" }, tok.t);
            }
          });
        });
        if (g.end < D) tl.to(box, { opacity: 0, y: -20, duration: 0.15 }, g.end - 0.15);
      });

      // Bracket fokus
      (E.brackets || []).forEach((b) => {
        const [x, y, w, h] = b.box, p = 0.35 * w; // ruang sekeliling muka
        const L = x - p, T = y - p, R = x + w + p, B = y + h + p * 1.2;
        const corners = [["tl0", L, T], ["tr0", R - 58, T], ["bl0", L, B - 58], ["br0", R - 58, B - 58]].map(([c, cx, cy]) => {
          const n = put(`<div class="br ${c} shadow"></div>`); n.style.left = cx + "px"; n.style.top = cy + "px"; return n;
        });
        tl.set(corners, { opacity: 0 }, 0);
        corners.forEach((n, i) => {
          const dx = i % 2 ? 40 : -40, dy = i < 2 ? -40 : 40;
          tl.fromTo(n, { opacity: 0, x: dx, y: dy }, { opacity: 1, x: 0, y: 0, duration: 0.18, ease: "power3.out" }, b.start);
        });
        tl.to(corners, { scale: 0.92, duration: 0.12, yoyo: true, repeat: 1 }, b.start + 0.2);
        tl.set(corners, { opacity: 0 }, b.end);
      });

      // Callout
      (E.callouts || []).forEach((c) => {
        const icon = c.kind === "ok" ? "✓" : c.kind === "no" ? "✕" : "";
        const n = put(`<div class="co ${c.kind} shadow"><span class="ic">${icon}</span><span>${c.text}</span></div>`);
        n.style.left = c.x + "px"; n.style.top = c.y + "px";
        tl.set(n, { opacity: 0 }, 0);
        tl.fromTo(n, { opacity: 0, scale: 0.6, x: -20 }, { opacity: 1, scale: 1, x: 0, duration: 0.22, ease: "back.out(2.2)" }, c.t);
        if (c.end < D) tl.to(n, { opacity: 0, duration: 0.12 }, c.end - 0.12);
      });

      // Subtitle karaoke
      const subs = put(`<div id="subs"></div>`);
      const groups = []; let cur = [];
      E.words.forEach((w, i) => {
        const prev = E.words[i - 1];
        const brk = cur.length >= (E.maxWords || 4) || (prev && (w.s - prev.e > 0.3 || /[.,?!]$/.test(prev.w)));
        if (cur.length && brk) { groups.push(cur); cur = []; }
        cur.push(w);
      });
      if (cur.length) groups.push(cur);
      groups.forEach((g, gi) => {
        const node = el(`<div class="grp"></div>`); subs.appendChild(node);
        const spans = g.map((w) => { const s = el(`<span class="sw">${w.w}</span>`); node.appendChild(s); return s; });
        tl.set(node, { opacity: 0 }, 0);
        tl.fromTo(node, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.12 }, Math.max(g[0].s - 0.05, 0));
        g.forEach((w, i) => {
          tl.set(spans[i], { className: "sw on" }, w.s);
          tl.set(spans[i], { className: "sw" }, g[i + 1] ? g[i + 1].s : w.e + 0.15);
        });
        const nxt = groups[gi + 1];
        tl.set(node, { opacity: 0 }, nxt ? nxt[0].s - 0.05 : Math.min(g[g.length - 1].e + 0.4, D));
      });

      // CTA
      if (E.cta) {
        const c = put(`<div id="cta"><span class="shadow">${E.cta.text}</span></div>`);
        tl.set(c, { opacity: 0 }, 0);
        tl.fromTo(c, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.25, ease: "back.out(2)" }, E.cta.start);
      }

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
