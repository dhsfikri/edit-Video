<!doctype html>
<!--
  Iklan 4 saat (penuh skrin, 1080x1920). Latar halaman TELUS supaya panel "slide" masuk atas frame beku Sir.
  (Versi 2 saat lama: index_2s.html)
  Babak:
    0.00–0.25  panel hijau sapu masuk dari bawah
    0.15–1.30  label + "SETUP TEAM SALES" + 3 ikon ahli team pop & bersambung + keyword "A–Z"
    1.15–2.90  checklist ditanda satu-satu + bar "30 HARI" penuh
    2.75–4.00  CTA "WhatsApp link di bio" berdenyut, kemudian semua keluar
  Tukar teks guna variables. Render: npx hyperframes render --format mov -f 50 -o iklan.mov
  Bunyi "ding" (assets/ding.wav) dicampur dalam FFmpeg semasa gabung.
-->
<html lang="ms" data-resolution="portrait"
  data-composition-variables='[
    {"id":"label","type":"string","label":"Label kecil","default":"SERVIS SIR DHARMA"},
    {"id":"line1","type":"string","label":"Teks besar","default":"SETUP TEAM SALES"},
    {"id":"keyword","type":"string","label":"Keyword kuning","default":"A–Z"},
    {"id":"items","type":"string","label":"Checklist (pisah dengan |)","default":"Setup team|Skrip & SOP|Monitoring 30 hari"},
    {"id":"cta","type":"string","label":"CTA","default":"💬 WhatsApp link di bio"}
  ]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Montserrat"; font-weight: 800; src: url("assets/montserrat-latin-800-normal.woff2") format("woff2"); }
      @font-face { font-family: "Montserrat"; font-weight: 600; src: url("assets/montserrat-latin-600-normal.woff2") format("woff2"); }
      @font-face { font-family: "Noto Color Emoji"; src: local("Noto Color Emoji"); }
      :root { --green: #25d366; --yellow: #ffd60a; --ink: #0b0b0b; --white: #fff; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Montserrat", "Noto Color Emoji", sans-serif; }
      #panel { position: absolute; inset: 0; background: var(--green); overflow: hidden; }
      #stripes { position: absolute; inset: -400px; opacity: 0.12; background: repeating-linear-gradient(45deg, var(--ink) 0 40px, transparent 40px 110px); }

      #label { position: absolute; left: 0; right: 0; top: 250px; text-align: center; }
      #label span { display: inline-block; color: var(--green); background: var(--ink); font-weight: 800; font-size: 34px; letter-spacing: .12em; padding: 12px 30px; border-radius: 999px; }
      #head { position: absolute; left: 60px; right: 60px; top: 350px; text-align: center; }
      #l1 { color: var(--ink); font-weight: 800; font-size: 104px; line-height: 1.02; white-space: nowrap; }
      #kw { display: inline-block; margin-top: 14px; background: var(--yellow); color: var(--ink); font-weight: 800; font-size: 130px; line-height: 1.1;
        padding: 0 44px; border-radius: 26px; border: 6px solid var(--ink); box-shadow: 10px 10px 0 var(--ink); }

      #team { position: absolute; left: 0; right: 0; top: 720px; height: 190px; }
      #team .line { position: absolute; left: 290px; right: 290px; top: 92px; height: 8px; background: var(--ink); border-radius: 4px; transform-origin: left center; }
      #team .p { position: absolute; top: 0; width: 180px; height: 180px; border-radius: 50%; background: var(--ink); border: 8px solid var(--white);
        display: flex; align-items: center; justify-content: center; font-size: 96px; }
      #team .p:nth-child(2) { left: 200px; } #team .p:nth-child(3) { left: 450px; background: var(--yellow); } #team .p:nth-child(4) { left: 700px; }

      #list { position: absolute; left: 90px; right: 90px; top: 960px; background: var(--ink); border-radius: 36px; padding: 34px 44px; box-shadow: 0 24px 60px rgba(0,0,0,.35); }
      .it { display: flex; align-items: center; gap: 26px; height: 92px; color: var(--white); font-weight: 800; font-size: 54px; white-space: nowrap; }
      .box { width: 64px; height: 64px; border-radius: 16px; border: 5px solid #3a3a3a; display: flex; align-items: center; justify-content: center; flex: none; }
      .tick { color: var(--ink); font-size: 46px; line-height: 1; }
      #bar { margin-top: 22px; height: 34px; border-radius: 17px; background: #262626; overflow: hidden; position: relative; }
      #fill { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; background: linear-gradient(90deg, var(--green), var(--yellow)); transform-origin: left center; }
      #days { margin-top: 12px; text-align: right; color: var(--green); font-weight: 800; font-size: 34px; }

      #cta { position: absolute; left: 0; right: 0; top: 1500px; text-align: center; }
      #cta span { display: inline-block; background: var(--ink); color: var(--white); font-weight: 800; font-size: 56px; padding: 26px 46px; border-radius: 999px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4" data-width="1080" data-height="1920">
      <div id="stage" class="clip" data-start="0" data-duration="4" data-track-index="0">
        <div id="panel"><div id="stripes"></div></div>
        <div id="label"><span></span></div>
        <div id="head"><div id="l1"></div><span id="kw"></span></div>
        <div id="team"><div class="line"></div><div class="p">👤</div><div class="p">🧑‍💼</div><div class="p">👤</div></div>
        <div id="list"></div>
        <div id="cta"><span></span></div>
      </div>
    </div>
    <script>
      const V = window.__hyperframes.getVariables();
      const $ = (s) => document.querySelector(s);
      $("#label span").textContent = V.label; $("#l1").textContent = V.line1; $("#kw").textContent = V.keyword; $("#cta span").textContent = V.cta;
      let z = 104; while ($("#l1").scrollWidth > 960 && z > 60) { z -= 2; $("#l1").style.fontSize = z + "px"; }
      const items = V.items.split("|").map((s) => s.trim()).filter(Boolean);
      $("#list").innerHTML = items.map((t) => `<div class="it"><span class="box"><span class="tick">✓</span></span><span class="tx">${t}</span></div>`).join("")
        + `<div id="bar"><div id="fill"></div></div><div id="days">30 HARI ✓</div>`;

      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#panel", { yPercent: 100 }, { yPercent: 0, duration: 0.25, ease: "power3.out" }, 0);
      tl.fromTo("#stripes", { x: 0 }, { x: 220, duration: 4, ease: "none" }, 0);
      // Beat 1: tajuk + team
      tl.fromTo("#label span", { y: -40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.25, ease: "back.out(2)" }, 0.15);
      tl.fromTo("#l1", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, 0.22);
      tl.fromTo("#kw", { scale: 0, rotation: -14 }, { scale: 1, rotation: -3, duration: 0.35, ease: "back.out(3)" }, 0.42);
      tl.fromTo("#team .p", { scale: 0 }, { scale: 1, duration: 0.3, stagger: 0.12, ease: "back.out(2.6)" }, 0.55);
      tl.fromTo("#team .line", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power2.out" }, 0.75);
      tl.to("#team .p:nth-child(3)", { y: -18, duration: 0.15, yoyo: true, repeat: 1, ease: "sine.inOut" }, 1.1);
      // Beat 2: checklist + bar 30 hari
      tl.fromTo("#list", { y: 120, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, 1.15);
      tl.set(".tick", { scale: 0 }, 0);
      tl.set("#fill", { scaleX: 0 }, 0);
      tl.set("#days", { opacity: 0 }, 0);
      document.querySelectorAll(".it").forEach((it, i) => {
        const t = 1.45 + i * 0.42;
        tl.fromTo(it.querySelector(".tx"), { x: 40, opacity: 0.35 }, { x: 0, opacity: 1, duration: 0.2 }, t - 0.1);
        tl.to(it.querySelector(".box"), { backgroundColor: "#25d366", borderColor: "#25d366", duration: 0.08 }, t);
        tl.fromTo(it.querySelector(".tick"), { scale: 0, rotation: -30 }, { scale: 1, rotation: 0, duration: 0.25, ease: "back.out(3)" }, t);
      });
      tl.to("#fill", { scaleX: 1, duration: 1.3, ease: "power1.inOut" }, 1.45);
      tl.to("#days", { opacity: 1, duration: 0.2 }, 2.7);
      // Beat 3: CTA
      tl.fromTo("#cta span", { y: 120, opacity: 0, scale: 0.8 }, { y: 0, opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, 2.75);
      tl.to("#cta span", { scale: 1.07, duration: 0.18, yoyo: true, repeat: 3, ease: "sine.inOut" }, 3.05);
      // Keluar (panel kekal sampai potong balik ke Sir)
      tl.to(["#label", "#head", "#team", "#list", "#cta"], { yPercent: -60, opacity: 0, duration: 0.2, stagger: 0.02, ease: "power2.in" }, 3.75);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
