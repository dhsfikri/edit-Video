<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:A;src:url(anton-latin-400-normal.woff2)}

*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1080px;overflow:hidden}
.v{display:none;width:1080px;height:1080px;position:relative;overflow:hidden}
body.v1 #v1,body.v2 #v2,body.v3 #v3{display:block}
</style></head><body>
<!-- V1: Monogram AC dalam gelembung chat + tick berganda -->
<div class="v" id="v1" style="background:#0B0B0B">
 <svg width="1080" height="1080" viewBox="0 0 1080 1080">

   <path d="M640 760 L 690 810 L 790 700"/><path d="M720 790 L 740 810 L 840 700"/></g>
 </svg>
</div>
<!-- V2: Wordmark bertindan ADAB / CLOSING -->

 <div style="position:absolute;left:50%;top:560px;transform:translateX(-50%) rotate(-2deg);background:#FFD60A;border-radius:22px;padding:6px 40px;font-family:A;font-size:190px;line-height:1.05;color:#0B0B0B;letter-spacing:4px;white-space:nowrap">CLOSING</div>
 <svg style="position:absolute;left:470px;top:150px" width="140" height="110" viewBox="0 0 140 110"><path d="M70 6 C 112 6 134 28 134 50 C 134 74 112 94 70 94 C 62 94 54 93 47 91 L 18 106 L 26 82 C 12 73 6 62 6 50 C 6 28 28 6 70 6 Z" fill="#25D366"/></svg>
</div>
<!-- V3: Gelembung garis + tick, nama tulisan -->
<div class="v" id="v3" style="background:#F6F3EC">
 <svg width="1080" height="1080" viewBox="0 0 1080 1080" style="position:absolute;inset:0">
  <path d="M540 170 C 730 170 850 280 850 430 C 850 580 730 680 540 680 C 498 680 458 674 422 664 L 300 740 L 332 622 C 270 576 230 510 230 430 C 230 280 350 170 540 170 Z" fill="none" stroke="#0B0B0B" stroke-width="34" stroke-linejoin="round"/>

 </svg>
 <div style="position:absolute;left:0;right:0;top:770px;text-align:center;font-family:P;font-weight:800;font-size:122px;color:#0B0B0B;letter-spacing:-3px;line-height:1">adab<span style="color:#25D366">closing</span></div>
</div>
</body></html>
